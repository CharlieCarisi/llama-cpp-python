                  GGML_LOG_INFO("[vulkan-legacy12] backend compute context reset: node_index=%d exit_tensor_idx=%d\n",
                                node_idx,
                                compute_ctx->exit_tensor_idx);

                  GGML_LOG_INFO("[vulkan-legacy12] compute-forward call begin: node_index=%d\n", node_idx);
                  ggml_vk_compute_forward(ctx, cgraph, node_begin, node_idx_begin, almost_ready);
                  GGML_LOG_INFO("[vulkan-legacy12] compute-forward call complete: node_index=%d\n", node_idx);
              }
              GGML_LOG_INFO("[vulkan-legacy12] graph build return true: node_index=%d\n", node_idx);
              return true;
          }
          '@

          if (-not $vulkanSource.Contains($oldVkBuildGraphTail)) {
            throw "Expected Vulkan graph-build tail was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkBuildGraphTail, $legacyVkBuildGraphTail)

          $oldVkCtxEnd = @'
          static void ggml_vk_ctx_end(vk_context& ctx) {
              VK_LOG_DEBUG("ggml_vk_ctx_end(" << ctx << ", " << ctx->seqs.size() << ")");
              if (ctx->s == nullptr) {
                  return;
              }

              ctx->s->buffer->buf.end();
              ctx->s = nullptr;
          }
          '@

          $legacyVkCtxEnd = @'
          static void ggml_vk_ctx_end(vk_context& ctx) {
              VK_LOG_DEBUG("ggml_vk_ctx_end(" << ctx << ", " << ctx->seqs.size() << ")");
              GGML_LOG_INFO("[vulkan-legacy12] context end entry: ctx=%p sequences=%zu active_submission=%p\n",
                            (void *) ctx.get(),
                            ctx->seqs.size(),
                            (void *) ctx->s);
              if (ctx->s == nullptr) {
                  GGML_LOG_INFO("[vulkan-legacy12] context end bypassed: no active submission\n");
                  return;
              }

              GGML_ASSERT(ctx->s->buffer != nullptr);
              GGML_ASSERT((VkCommandBuffer) ctx->s->buffer->buf != VK_NULL_HANDLE);
              GGML_LOG_INFO("[vulkan-legacy12] command-buffer end begin: wrapper=%p command_buffer=%p\n",
                            (void *) ctx->s->buffer,
                            (void *) (VkCommandBuffer) ctx->s->buffer->buf);
              ctx->s->buffer->buf.end();
              GGML_LOG_INFO("[vulkan-legacy12] command-buffer end complete: command_buffer=%p\n",
                            (void *) (VkCommandBuffer) ctx->s->buffer->buf);
              ctx->s = nullptr;
              GGML_LOG_INFO("[vulkan-legacy12] active submission cleared\n");
          }
          '@

          if (-not $vulkanSource.Contains($oldVkCtxEnd)) {
            throw "Expected Vulkan context-end function was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkCtxEnd, $legacyVkCtxEnd)

          $oldVkSubmitTail = @'
              ctx->p->q->queue.submit(submit_infos, fence);

              ctx->seqs.clear();
          '@

          $legacyVkSubmitTail = @'
              GGML_ASSERT(ctx->p != nullptr);
              GGML_ASSERT(ctx->p->q != nullptr);
              GGML_ASSERT((VkQueue) ctx->p->q->queue != VK_NULL_HANDLE);
              GGML_LOG_INFO("[vulkan-legacy12] queue submit begin: ctx=%p queue=%p submissions=%zu fence=%p\n",
                            (void *) ctx.get(),
                            (void *) (VkQueue) ctx->p->q->queue,
                            submit_infos.size(),
                            (void *) (VkFence) fence);
              ctx->p->q->queue.submit(submit_infos, fence);
              GGML_LOG_INFO("[vulkan-legacy12] queue submit complete: submissions=%zu\n",
                            submit_infos.size());

              ctx->seqs.clear();
              GGML_LOG_INFO("[vulkan-legacy12] submitted sequence registry cleared\n");
          '@

          if (-not $vulkanSource.Contains($oldVkSubmitTail)) {
            throw "Expected Vulkan queue-submit tail was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkSubmitTail, $legacyVkSubmitTail)

          $oldVkFenceWait = @'
              // Spin (w/pause) waiting for the graph to finish executing.
              vk::Result result;
              while ((result = ctx->device->device.getFenceStatus(ctx->fence)) != vk::Result::eSuccess) {
                  if (result != vk::Result::eNotReady) {
                      fprintf(stderr, "ggml_vulkan: error %s at %s:%d\n", to_string(result).c_str(), __FILE__, __LINE__);
                      exit(1);
                  }
                  for (uint32_t i = 0; i < 100; ++i) {
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                  }
              }
              ctx->device->device.resetFences({ ctx->fence });
          '@

          $legacyVkFenceWait = @'
              // Spin (w/pause) waiting for the graph to finish executing.
              GGML_ASSERT((VkDevice) ctx->device->device != VK_NULL_HANDLE);
              GGML_ASSERT((VkFence) ctx->fence != VK_NULL_HANDLE);
              GGML_LOG_INFO("[vulkan-legacy12] fence polling begin: fence=%p\n",
                            (void *) (VkFence) ctx->fence);
              vk::Result result;
              uint64_t poll_count = 0;
              while ((result = ctx->device->device.getFenceStatus(ctx->fence)) != vk::Result::eSuccess) {
                  if (result != vk::Result::eNotReady) {
                      fprintf(stderr, "ggml_vulkan: error %s at %s:%d\n", to_string(result).c_str(), __FILE__, __LINE__);
                      exit(1);
                  }
                  poll_count++;
                  for (uint32_t i = 0; i < 100; ++i) {
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                      YIELD();
                  }
              }
              GGML_LOG_INFO("[vulkan-legacy12] fence signaled: fence=%p polls=%llu\n",
                            (void *) (VkFence) ctx->fence,
                            (unsigned long long) poll_count);
              GGML_LOG_INFO("[vulkan-legacy12] fence reset begin: fence=%p\n",
                            (void *) (VkFence) ctx->fence);
              ctx->device->device.resetFences({ ctx->fence });
              GGML_LOG_INFO("[vulkan-legacy12] fence reset complete: fence=%p\n",
                            (void *) (VkFence) ctx->fence);
          '@

          if (-not $vulkanSource.Contains($oldVkFenceWait)) {
            throw "Expected Vulkan fence polling block was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkFenceWait, $legacyVkFenceWait)

          $oldVkComputeForwardSubmit = @'
                  if (almost_ready && !ctx->almost_ready_fence_pending) {
                      ggml_vk_submit(subctx, ctx->almost_ready_fence);
                      ctx->almost_ready_fence_pending = true;
                  } else {
                      ggml_vk_submit(subctx, {});
                  }
                  ctx->submit_pending = true;
          '@

          $legacyVkComputeForwardSubmit = @'
                  GGML_LOG_INFO("[vulkan-legacy12] compute-forward submission begin: subctx=%p sequences=%zu almost_ready=%d pending_almost_ready=%d\n",
                                (void *) subctx.get(),
                                subctx->seqs.size(),
                                almost_ready ? 1 : 0,
                                ctx->almost_ready_fence_pending ? 1 : 0);
                  if (almost_ready && !ctx->almost_ready_fence_pending) {
                      ggml_vk_submit(subctx, ctx->almost_ready_fence);
                      ctx->almost_ready_fence_pending = true;
                  } else {
                      ggml_vk_submit(subctx, {});
                  }
                  GGML_LOG_INFO("[vulkan-legacy12] compute-forward submission complete: remaining_sequences=%zu\n",
                                subctx->seqs.size());
                  ctx->submit_pending = true;
                  GGML_LOG_INFO("[vulkan-legacy12] backend submit-pending set\n");
          '@

          if (-not $vulkanSource.Contains($oldVkComputeForwardSubmit)) {
            throw "Expected Vulkan compute-forward submission block was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkComputeForwardSubmit, $legacyVkComputeForwardSubmit)

          $oldVkSynchronizeCore = @'
                  ggml_vk_ctx_end(compute_ctx);

                  for (auto& cpy : compute_ctx->in_memcpys) {
                      memcpy(cpy.dst, cpy.src, cpy.n);
                  }

                  ggml_vk_submit(compute_ctx, {});
                  ctx->submit_pending = true;
          '@

          $legacyVkSynchronizeCore = @'
                  GGML_LOG_INFO("[vulkan-legacy12] synchronize context end begin: compute_ctx=%p\n",
                                (void *) compute_ctx.get());
                  ggml_vk_ctx_end(compute_ctx);
                  GGML_LOG_INFO("[vulkan-legacy12] synchronize context end complete\n");

                  for (auto& cpy : compute_ctx->in_memcpys) {
                      memcpy(cpy.dst, cpy.src, cpy.n);
                  }
                  GGML_LOG_INFO("[vulkan-legacy12] synchronize input copies complete: count=%zu\n",
                                compute_ctx->in_memcpys.size());

                  GGML_LOG_INFO("[vulkan-legacy12] synchronize queued-work submit begin\n");
                  ggml_vk_submit(compute_ctx, {});
                  GGML_LOG_INFO("[vulkan-legacy12] synchronize queued-work submit complete\n");
                  ctx->submit_pending = true;
          '@

          if (-not $vulkanSource.Contains($oldVkSynchronizeCore)) {
            throw "Expected Vulkan synchronize core block was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkSynchronizeCore, $legacyVkSynchronizeCore)

          $oldVkFinalFence = @'
                      ctx->device->compute_queue.queue.submit({}, ctx->fence);
                  }
                  ggml_vk_wait_for_fence(ctx);
                  ctx->submit_pending = false;
                  if (cmd_buf) {
                      cmd_buf->in_use = false;
                      cmd_buf->buf.reset();
                  }
          '@

          $legacyVkFinalFence = @'
                      GGML_LOG_INFO("[vulkan-legacy12] empty fence-submit begin: queue=%p fence=%p\n",
                                    (void *) (VkQueue) ctx->device->compute_queue.queue,
                                    (void *) (VkFence) ctx->fence);
                      ctx->device->compute_queue.queue.submit({}, ctx->fence);
                      GGML_LOG_INFO("[vulkan-legacy12] empty fence-submit complete\n");
                  }
                  GGML_LOG_INFO("[vulkan-legacy12] fence wait call begin\n");
                  ggml_vk_wait_for_fence(ctx);
                  GGML_LOG_INFO("[vulkan-legacy12] fence wait call complete\n");
                  ctx->submit_pending = false;
                  GGML_LOG_INFO("[vulkan-legacy12] backend submit-pending cleared\n");
                  if (cmd_buf) {
                      GGML_LOG_INFO("[vulkan-legacy12] command-buffer reset begin: wrapper=%p command_buffer=%p\n",
                                    (void *) cmd_buf,
                                    (void *) (VkCommandBuffer) cmd_buf->buf);
                      cmd_buf->in_use = false;
                      cmd_buf->buf.reset();
                      GGML_LOG_INFO("[vulkan-legacy12] command-buffer reset complete\n");
                  }
          '@

          if (-not $vulkanSource.Contains($oldVkFinalFence)) {
            throw "Expected Vulkan final fence-submit block was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkFinalFence, $legacyVkFinalFence)

          $oldDeviceInit = @'
          static ggml_backend_t ggml_backend_vk_device_init(ggml_backend_dev_t dev, const char * params) {
              UNUSED(params);
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *)dev->context;
              return ggml_backend_vk_init(ctx->device);
          }
          '@

          $legacyDeviceInit = @'
          static ggml_backend_t ggml_backend_vk_device_init(ggml_backend_dev_t dev, const char * params) {
              UNUSED(params);
              GGML_LOG_INFO("[vulkan-legacy5] registry device init begin: dev=%p\n", (void *) dev);
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *) dev->context;
              GGML_LOG_INFO("[vulkan-legacy5] registry device init context: ctx=%p index=%zu\n", (void *) ctx, ctx->device);

              // The registry already supplied dev. Reuse it directly instead of
              // calling the public initializer, which resolves the registry again.
              ggml_backend_t backend = ggml_backend_vk_init_with_device(ctx->device, dev);
              GGML_LOG_INFO("[vulkan-legacy5] registry device init complete: backend=%p\n", (void *) backend);
              return backend;
          }
          '@

          if (-not $vulkanSource.Contains($oldDeviceInit)) {
            throw "Expected Vulkan registry device initializer was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldDeviceInit, $legacyDeviceInit)
          Set-Content $vulkanPath $vulkanSource -Encoding UTF8

          $initPath = "src\llama_cpp\__init__.py"
          $init = Get-Content $initPath -Raw
          $oldVersion = "__version__ = `"$env:SOURCE_VERSION`""
          $newVersion = "__version__ = `"$env:PACKAGE_VERSION`""
          if (-not $init.Contains($oldVersion)) {
            throw "Expected package version $oldVersion was not found"
          }
          $init = $init.Replace($oldVersion, $newVersion)
          Set-Content $initPath $init -Encoding UTF8

          git -C src diff -- CMakeLists.txt llama_cpp/__init__.py vendor/llama.cpp/src/CMakeLists.txt vendor/llama.cpp/ggml/src/ggml-threading.cpp vendor/llama.cpp/ggml/src/ggml-vulkan/ggml-vulkan.cpp

      - name: Configure optimized Tiger Lake and Vulkan build
        shell: pwsh
        run: |
          $flags = @(
            "-DCMAKE_BUILD_TYPE=Release",
            "-DBUILD_SHARED_LIBS=OFF",
            "-DLLAVA_BUILD=OFF",
            "-DGGML_NATIVE=OFF",
            "-DGGML_OPENMP=ON",
            "-DGGML_BACKEND_DL=OFF",
            "-DGGML_CPU_ALL_VARIANTS=OFF",
            "-DGGML_CPU_REPACK=ON",
            "-DGGML_BLAS=OFF",
            "-DGGML_CUDA=OFF",
            "-DGGML_HIP=OFF",
            "-DGGML_SYCL=OFF",
            "-DGGML_OPENCL=OFF",
            "-DGGML_RPC=OFF",
            "-DGGML_METAL=OFF",
            "-DGGML_VULKAN=ON",
            "-DGGML_SSE42=ON",
            "-DGGML_AVX=ON",
            "-DGGML_AVX2=ON",
            "-DGGML_FMA=ON",
            "-DGGML_F16C=ON",
            "-DGGML_BMI2=ON",
            "-DGGML_AVX512=ON",
            "-DGGML_AVX512_VBMI=ON",
            "-DGGML_AVX512_VNNI=ON",
            "-DGGML_AVX512_BF16=OFF",
            "-DLLAMA_BUILD_TESTS=OFF",
            "-DLLAMA_BUILD_EXAMPLES=OFF",
            "-DLLAMA_BUILD_TOOLS=OFF",
            "-DLLAMA_BUILD_SERVER=OFF"
          )

          $argsLine = $flags -join " "
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_ARGS=$argsLine" >> $env:GITHUB_ENV
          Write-Host "CMAKE_ARGS=$argsLine"

      - name: Build wheel
        shell: pwsh
        run: |
          Set-Location src
          $outDir = Join-Path $env:GITHUB_WORKSPACE "wheelhouse"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          python -m build --wheel --outdir $outDir

      - name: Verify packaging and backend initialization
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "wheelhouse\*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel was produced"
          }

          python -m venv testenv
          $testPython = Join-Path $env:GITHUB_WORKSPACE "testenv\Scripts\python.exe"
          & $testPython -m pip install --upgrade "pip<26"
          & $testPython -m pip install --no-cache-dir $wheel.FullName

          New-Item -ItemType Directory -Force reports | Out-Null

          $testOutput = @'
          import platform
          import sys

          import llama_cpp

          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("llama-cpp-python:", llama_cpp.__version__)

          print("Calling llama_backend_init()", flush=True)
          llama_cpp.llama_backend_init()
          print("BACKEND INIT OK", flush=True)
          llama_cpp.llama_backend_free()
          print("BACKEND FREE OK", flush=True)
          '@ | & $testPython -I -X faulthandler -u 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Tee-Object "reports\legacy-vulkan-runtime-test.txt"
          if ($testExitCode -ne 0) {
            throw "Backend validation failed with exit code $testExitCode"
          }

          $llamaDll = Join-Path $env:GITHUB_WORKSPACE "testenv\Lib\site-packages\llama_cpp\lib\llama.dll"
          dumpbin /DEPENDENTS $llamaDll |
            Tee-Object "reports\legacy-vulkan-dll-dependencies.txt"

      - name: Create reproducibility manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $manifest = "reports\legacy-vulkan-build-manifest.txt"
          "package_version=$env:PACKAGE_VERSION" | Set-Content $manifest
          "source_version=$env:SOURCE_VERSION" | Add-Content $manifest
          "source_commit=$(git -C src rev-parse HEAD)" | Add-Content $manifest
          "python=$(python --version 2>&1)" | Add-Content $manifest
          "cmake_args=$env:CMAKE_ARGS" | Add-Content $manifest
          "core_srwlock_fix=enabled" | Add-Content $manifest
          "vulkan_registry_pod_state=enabled" | Add-Content $manifest
          "vulkan_registry_srwlock=enabled" | Add-Content $manifest
          "vulkan_direct_registry_device_init=enabled" | Add-Content $manifest
          "vulkan_preconstruction_registry_lookup=removed" | Add-Content $manifest
          "vulkan_buffer_type_direct_binding=enabled" | Add-Content $manifest
          "vulkan_buffer_type_checkpoints=enabled" | Add-Content $manifest
          "vulkan_pinned_host_buffer=disabled" | Add-Content $manifest
          "vulkan_minimal_intel_feature_profile=enabled" | Add-Content $manifest
          "vulkan_optional_extensions=disabled" | Add-Content $manifest
          "vulkan_async_backend=disabled" | Add-Content $manifest
          "vulkan_device_init_checkpoints=enabled" | Add-Content $manifest
          "vulkan_cpu_host_buffer_fallback=enabled" | Add-Content $manifest
          "vulkan_registry_return_checkpoints=enabled" | Add-Content $manifest
          "vulkan_per_device_critical_section=enabled" | Add-Content $manifest
          "vulkan_recursive_lock_sites_replaced=6" | Add-Content $manifest
          "vulkan_queue_creation_checkpoints=enabled" | Add-Content $manifest
          "vulkan_global_queue_srwlock=enabled" | Add-Content $manifest
          "vulkan_global_queue_lock_sites_replaced=4" | Add-Content $manifest
          "vulkan_global_queue_lock_checkpoints=enabled" | Add-Content $manifest
          "vulkan_compile_critical_section=enabled" | Add-Content $manifest
          "vulkan_compile_lock_sites_replaced=8" | Add-Content $manifest
          "vulkan_shader_loader_checkpoints=enabled" | Add-Content $manifest
          "vulkan_runtime_fp16_rte_spirv_rewrite=disabled" | Add-Content $manifest
          "vulkan_multi_add=disabled" | Add-Content $manifest
          "vulkan_pipeline_stage_checkpoints=enabled" | Add-Content $manifest
          "vulkan_pipeline_cleanup_registry=bypassed" | Add-Content $manifest
          "vulkan_compile_condition_variable=disabled" | Add-Content $manifest
          "vulkan_compile_wait_strategy=atomic_polling" | Add-Content $manifest
          "vulkan_pipeline_completion_checkpoints=enabled" | Add-Content $manifest
          "vulkan_descriptor_allocation_checkpoints=enabled" | Add-Content $manifest
          "vulkan_descriptor_handle_validation=enabled" | Add-Content $manifest
          "vulkan_tensor_subbuffer_checkpoints=enabled" | Add-Content $manifest
          "vulkan_command_buffer_checkpoints=enabled" | Add-Content $manifest
          "vulkan_dispatch_recording_checkpoints=enabled" | Add-Content $manifest
          "vulkan_graph_return_checkpoints=enabled" | Add-Content $manifest
          "vulkan_command_buffer_end_checkpoints=enabled" | Add-Content $manifest
          "vulkan_queue_submit_checkpoints=enabled" | Add-Content $manifest
          "vulkan_fence_wait_checkpoints=enabled" | Add-Content $manifest
          "vulkan_command_buffer_reset_checkpoints=enabled" | Add-Content $manifest
          "submodules:" | Add-Content $manifest
          git -C src submodule status | Add-Content $manifest

          Get-ChildItem "wheelhouse\*.whl" -ErrorAction SilentlyContinue | ForEach-Object {
            "wheel=$($_.Name)" | Add-Content $manifest
            "wheel_size=$($_.Length)" | Add-Content $manifest
            "wheel_sha256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" | Add-Content $manifest
          }
          Get-Content $manifest

      - name: Upload wheel and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-python-${{ env.PACKAGE_VERSION }}-win-amd64
          path: |
            wheelhouse/*.whl
            reports/*.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish legacy Vulkan prerelease
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download legacy Vulkan wheel and reports
        uses: actions/download-artifact@v7
        with:
          name: llama-cpp-python-${{ env.PACKAGE_VERSION }}-win-amd64
          path: release-assets

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Experimental Windows x64 / Python 3.9 Vulkan compatibility wheel for llama-cpp-python 0.3.34 and legacy Intel Iris Xe driver stacks.

          This build keeps the confirmed GGML and Vulkan-registry SRWLOCK fixes, direct registry-device binding, CPU host-buffer fallback, minimal Intel Xe feature profile, per-device queue-lock compatibility fix, shader compile critical-section fix, r8 shader compatibility switches, r9 cleanup-registry bypass, r10 atomic pipeline completion, and r11-r12 command/submission diagnostics. The r12 target log proves command recording and command-buffer finalization complete, then faults before the first queue-submit checkpoint. R13 replaces the intervening process-global std::mutex queue lock with an initialized Windows SRWLOCK at all four guard sites and adds queue-lock checkpoints. It also corrects the diagnostic format for the uint32_t descriptor index.

          The GitHub Windows runner validated:
          - wheel packaging and clean Python 3.9 installation
          - llama_backend_init() and llama_backend_free()
          - DLL dependencies
          - reproducibility manifest and SHA-256

          GitHub's runner has no Vulkan GPU. It can validate compilation, packaging, and backend initialization, but actual tensor placement and offload must be validated on the target Iris Xe workstation. This is a diagnostic compatibility prerelease, not a replacement for the stable optimized CPU wheel.
          EOF

      - name: Create or update public prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.3.34-win39-vulkan-xelegacy-r13
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GH_REPO"
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GH_REPO" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          fi
