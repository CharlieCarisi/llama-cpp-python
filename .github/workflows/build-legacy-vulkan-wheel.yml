name: Build legacy Intel Vulkan compatibility wheel

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_VERSION: "0.3.34"
  PACKAGE_VERSION: "0.3.34+win.srw.vulkan.xelegacy13"
  VULKAN_SDK_VERSION: "1.4.341.0"

jobs:
  build:
    name: legacy-vulkan-irisxe
    runs-on: windows-2022

    steps:
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python 3.9 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version="$env:VULKAN_SDK_VERSION" --no-progress -y
          $sdk = Join-Path "C:\VulkanSDK" $env:VULKAN_SDK_VERSION
          if (-not (Test-Path $sdk)) {
            throw "Vulkan SDK was not found at $sdk"
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          & "$sdk\Bin\glslc.exe" --version

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install build wheel ninja

      - name: Clone exact upstream release
        shell: pwsh
        run: |
          $tag = "v$env:SOURCE_VERSION"
          git clone --branch $tag --depth 1 --recurse-submodules --shallow-submodules https://github.com/abetlen/llama-cpp-python.git src
          git -C src rev-parse HEAD
          git -C src submodule status

      - name: Apply monolithic layout and Windows compatibility fixes
        shell: pwsh
        run: |
          $pythonCmakePath = "src\CMakeLists.txt"
          $pythonCmake = Get-Content $pythonCmakePath -Raw
          $sharedSetting = 'set(BUILD_SHARED_LIBS "On")'
          if (-not $pythonCmake.Contains($sharedSetting)) {
            throw "Expected BUILD_SHARED_LIBS setting was not found"
          }
          $pythonCmake = $pythonCmake.Replace(
            $sharedSetting,
            'set(BUILD_SHARED_LIBS "Off")'
          )

          $ggmlRuntimeInstalls = [regex]'(?ms)\s*install\(\s*FILES \$<TARGET_RUNTIME_DLLS:ggml>\s*DESTINATION [^\r\n]+\s*\)'
          $ggmlRuntimeInstallMatches = $ggmlRuntimeInstalls.Matches($pythonCmake)
          if ($ggmlRuntimeInstallMatches.Count -ne 2) {
            throw "Expected two ggml runtime-DLL install rules, found $($ggmlRuntimeInstallMatches.Count)"
          }
          $pythonCmake = $ggmlRuntimeInstalls.Replace($pythonCmake, "")
          Set-Content $pythonCmakePath $pythonCmake -Encoding UTF8

          $llamaCmakePath = "src\vendor\llama.cpp\src\CMakeLists.txt"
          $llamaCmake = Get-Content $llamaCmakePath -Raw
          $addLlama = [regex]'add_library\(llama\s*\r?\n'
          if (-not $addLlama.IsMatch($llamaCmake)) {
            throw "Expected add_library(llama) declaration was not found"
          }
          $llamaCmake = $addLlama.Replace(
            $llamaCmake,
            "add_library(llama SHARED`r`n",
            1
          )
          Set-Content $llamaCmakePath $llamaCmake -Encoding UTF8

          $threadingPath = "src\vendor\llama.cpp\ggml\src\ggml-threading.cpp"
          $threadingSource = Get-Content $threadingPath -Raw
          $oldThreading = @'
          #include "ggml-threading.h"
          #include <mutex>

          std::mutex ggml_critical_section_mutex;

          void ggml_critical_section_start() {
              ggml_critical_section_mutex.lock();
          }

          void ggml_critical_section_end(void) {
              ggml_critical_section_mutex.unlock();
          }
          '@

          $srwThreading = @'
          #include "ggml-threading.h"

          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>

          static SRWLOCK ggml_critical_section_lock = SRWLOCK_INIT;

          void ggml_critical_section_start(void) {
              AcquireSRWLockExclusive(&ggml_critical_section_lock);
          }

          void ggml_critical_section_end(void) {
              ReleaseSRWLockExclusive(&ggml_critical_section_lock);
          }
          '@

          if (-not $threadingSource.Contains($oldThreading)) {
            throw "Expected ggml-threading.cpp implementation was not found"
          }
          $threadingSource = $threadingSource.Replace($oldThreading, $srwThreading)
          Set-Content $threadingPath $threadingSource -Encoding UTF8

          $vulkanPath = "src\vendor\llama.cpp\ggml\src\ggml-vulkan\ggml-vulkan.cpp"
          $vulkanSource = Get-Content $vulkanPath -Raw
          $oldRegistry = @'
          static ggml_backend_dev_t ggml_backend_vk_reg_get_device(ggml_backend_reg_t reg, size_t device) {
              static std::vector<ggml_backend_dev_t> devices;

              static bool initialized = false;

              {
                  static std::mutex mutex;
                  std::lock_guard<std::mutex> lock(mutex);
                  if (!initialized) {
                      const int min_batch_size = getenv("GGML_OP_OFFLOAD_MIN_BATCH") ? atoi(getenv("GGML_OP_OFFLOAD_MIN_BATCH")) : 32;
                      for (int i = 0; i < ggml_backend_vk_get_device_count(); i++) {
                          ggml_backend_vk_device_context * ctx = new ggml_backend_vk_device_context;
                          char desc[256];
                          ggml_backend_vk_get_device_description(i, desc, sizeof(desc));
                          ctx->device = i;
                          ctx->name = GGML_VK_NAME + std::to_string(i);
                          ctx->description = desc;
                          ctx->is_integrated_gpu = ggml_backend_vk_get_device_type(i) == vk::PhysicalDeviceType::eIntegratedGpu;
                          ctx->pci_bus_id = ggml_backend_vk_get_device_pci_id(i);
                          ctx->op_offload_min_batch_size = min_batch_size;
                          devices.push_back(new ggml_backend_device {
                              /* .iface   = */ ggml_backend_vk_device_i,
                              /* .reg     = */ reg,
                              /* .context = */ ctx,
                          });
                      }
                      initialized = true;
                  }
              }

              GGML_ASSERT(device < devices.size());
              return devices[device];
          }
          '@

          $legacyRegistry = @'
          // Keep registry state in zero-initialized POD values. This avoids the
          // function-local std::vector and std::mutex initialization paths that
          // fault on the target Windows/Python 3.9 + legacy Intel driver stack.
          static SRWLOCK ggml_backend_vk_devices_lock = SRWLOCK_INIT;
          static ggml_backend_dev_t * ggml_backend_vk_devices = nullptr;
          static size_t ggml_backend_vk_devices_count = 0;
          static bool ggml_backend_vk_devices_initialized = false;

          struct ggml_vk_srwlock_guard {
              SRWLOCK * lock;

              explicit ggml_vk_srwlock_guard(SRWLOCK * lock) : lock(lock) {
                  AcquireSRWLockExclusive(lock);
              }

              ~ggml_vk_srwlock_guard() {
                  ReleaseSRWLockExclusive(lock);
              }
          };

          static ggml_backend_dev_t ggml_backend_vk_reg_get_device(ggml_backend_reg_t reg, size_t device) {
              GGML_LOG_INFO("[vulkan-legacy] registry lock begin\n");
              ggml_vk_srwlock_guard lock(&ggml_backend_vk_devices_lock);
              GGML_LOG_INFO("[vulkan-legacy] registry lock acquired\n");

              if (!ggml_backend_vk_devices_initialized) {
                  const size_t count = ggml_backend_vk_get_device_count();
                  GGML_LOG_INFO("[vulkan-legacy] allocating registry for %zu device(s)\n", count);
                  ggml_backend_vk_devices = new ggml_backend_dev_t[count] {};

                  const int min_batch_size = getenv("GGML_OP_OFFLOAD_MIN_BATCH") ? atoi(getenv("GGML_OP_OFFLOAD_MIN_BATCH")) : 32;
                  for (size_t i = 0; i < count; i++) {
                      ggml_backend_vk_device_context * ctx = new ggml_backend_vk_device_context;
                      char desc[256];
                      ggml_backend_vk_get_device_description(i, desc, sizeof(desc));
                      ctx->device = i;
                      ctx->name = GGML_VK_NAME + std::to_string(i);
                      ctx->description = desc;
                      ctx->is_integrated_gpu = ggml_backend_vk_get_device_type(i) == vk::PhysicalDeviceType::eIntegratedGpu;
                      ctx->pci_bus_id = ggml_backend_vk_get_device_pci_id(i);
                      ctx->op_offload_min_batch_size = min_batch_size;
                      ggml_backend_vk_devices[i] = new ggml_backend_device {
                          /* .iface   = */ ggml_backend_vk_device_i,
                          /* .reg     = */ reg,
                          /* .context = */ ctx,
                      };
                  }
                  ggml_backend_vk_devices_count = count;
                  ggml_backend_vk_devices_initialized = true;
                  GGML_LOG_INFO("[vulkan-legacy] registry initialized\n");
              }

              GGML_ASSERT(device < ggml_backend_vk_devices_count);
              GGML_LOG_INFO("[vulkan-legacy5] registry return: index=%zu count=%zu device=%p\n",
                            device,
                            ggml_backend_vk_devices_count,
                            (void *) ggml_backend_vk_devices[device]);
              return ggml_backend_vk_devices[device];
          }
          '@

          if (-not $vulkanSource.Contains($oldRegistry)) {
            throw "Expected Vulkan registry implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldRegistry, $legacyRegistry)

          # Use the smallest practical Vulkan feature surface on the target
          # 2022 Intel Xe driver and add checkpoints inside full device creation.
          $oldVkDeviceEntry = @'
          static vk_device ggml_vk_get_device(size_t idx) {
              VK_LOG_DEBUG("ggml_vk_get_device(" << idx << ")");

              if (vk_instance.devices[idx] == nullptr) {
                  VK_LOG_DEBUG("Initializing new vk_device");
                  vk_device device = std::make_shared<vk_device_struct>();
                  vk_instance.devices[idx] = device;

                  device->memory_logger = std::unique_ptr<vk_memory_logger>(new vk_memory_logger());

                  size_t dev_num = vk_instance.device_indices[idx];

                  std::vector<vk::PhysicalDevice> physical_devices = vk_instance.instance.enumeratePhysicalDevices();
          '@

          $legacyVkDeviceEntry = @'
          static vk_device ggml_vk_get_device(size_t idx) {
              VK_LOG_DEBUG("ggml_vk_get_device(" << idx << ")");
              GGML_LOG_INFO("[vulkan-legacy5] device init entry: index=%zu selected_count=%zu\n",
                            idx, vk_instance.device_indices.size());
              GGML_ASSERT(idx < GGML_VK_MAX_DEVICES);
              GGML_ASSERT(idx < vk_instance.device_indices.size());
              GGML_LOG_INFO("[vulkan-legacy5] device cache probe begin\n");

              if (vk_instance.devices[idx] == nullptr) {
                  GGML_LOG_INFO("[vulkan-legacy5] device cache empty; allocating device state\n");
                  vk_device device = std::make_shared<vk_device_struct>();
                  vk_instance.devices[idx] = device;
                  GGML_LOG_INFO("[vulkan-legacy5] device state allocated: device=%p\n", (void *) device.get());

                  device->memory_logger = std::unique_ptr<vk_memory_logger>(new vk_memory_logger());
                  GGML_LOG_INFO("[vulkan-legacy5] memory logger allocated\n");

                  size_t dev_num = vk_instance.device_indices[idx];
                  GGML_LOG_INFO("[vulkan-legacy5] physical device ordinal=%zu\n", dev_num);

                  GGML_LOG_INFO("[vulkan-legacy5] physical device enumeration begin\n");
                  std::vector<vk::PhysicalDevice> physical_devices = vk_instance.instance.enumeratePhysicalDevices();
                  GGML_LOG_INFO("[vulkan-legacy5] physical device enumeration complete: count=%zu\n",
                                physical_devices.size());
          '@

          if (-not $vulkanSource.Contains($oldVkDeviceEntry)) {
            throw "Expected Vulkan device-entry implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkDeviceEntry, $legacyVkDeviceEntry)

          $oldVkPhysicalDeviceSetup = @'
                  device->physical_device = physical_devices[dev_num];
                  const std::vector<vk::ExtensionProperties> ext_props = device->physical_device.enumerateDeviceExtensionProperties();

                  device->architecture = get_device_architecture(device->physical_device);
          '@

          $legacyVkPhysicalDeviceSetup = @'
                  device->physical_device = physical_devices[dev_num];
                  GGML_LOG_INFO("[vulkan-legacy5] extension enumeration begin\n");
                  const std::vector<vk::ExtensionProperties> ext_props = device->physical_device.enumerateDeviceExtensionProperties();
                  GGML_LOG_INFO("[vulkan-legacy5] extension enumeration complete: count=%zu\n", ext_props.size());

                  device->architecture = get_device_architecture(device->physical_device);
                  GGML_LOG_INFO("[vulkan-legacy5] architecture resolved: value=%d\n", (int) device->architecture);
          '@

          if (-not $vulkanSource.Contains($oldVkPhysicalDeviceSetup)) {
            throw "Expected Vulkan physical-device setup was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPhysicalDeviceSetup, $legacyVkPhysicalDeviceSetup)

          $oldVkPropertiesAnchor = @'
                  }

                  vk::PhysicalDeviceProperties2 props2;
                  vk::PhysicalDeviceMaintenance3Properties props3;
          '@

          $legacyVkPropertiesAnchor = @'
                  }

                  // Legacy Intel compatibility profile. Keep required 16-bit
                  // storage and FP16, but do not enable optional extension paths
                  // known to vary substantially across old Windows drivers.
                  maintenance4_support = false;
                  sm_builtins = false;
                  amd_shader_core_properties2 = false;
                  pipeline_robustness = false;
                  coopmat2_support = false;
                  coopmat2_decode_vector_support = false;
                  pipeline_executable_properties_support = false;
                  device->subgroup_size_control = false;
                  device->coopmat_support = false;
                  device->integer_dot_product = false;
                  device->external_memory_host = false;
                  device->shader_64b_indexing = false;
                  device->memory_priority = false;
                  bfloat16_support = false;
                  dot2_f16_support = false;
                  GGML_LOG_INFO("[vulkan-legacy5] minimal Intel feature profile applied\n");

                  vk::PhysicalDeviceProperties2 props2;
                  vk::PhysicalDeviceMaintenance3Properties props3;
          '@

          if (-not $vulkanSource.Contains($oldVkPropertiesAnchor)) {
            throw "Expected Vulkan properties anchor was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPropertiesAnchor, $legacyVkPropertiesAnchor)

          $oldVkPropertiesQuery = @'
                  device->physical_device.getProperties2(&props2);
                  device->properties = props2.properties;
          '@

          $legacyVkPropertiesQuery = @'
                  GGML_LOG_INFO("[vulkan-legacy5] physical properties query begin\n");
                  device->physical_device.getProperties2(&props2);
                  GGML_LOG_INFO("[vulkan-legacy5] physical properties query complete\n");
                  device->properties = props2.properties;
          '@

          if (-not $vulkanSource.Contains($oldVkPropertiesQuery)) {
            throw "Expected Vulkan physical-properties query was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPropertiesQuery, $legacyVkPropertiesQuery)

          $oldVkAsyncSelection = @'
                  device->support_async = (device->vendor_id != VK_VENDOR_ID_INTEL ||
                                           std::string(device->properties.deviceName.data()).find("(DG1)") == std::string::npos) &&
                                          getenv("GGML_VK_DISABLE_ASYNC") == nullptr;
          '@

          $legacyVkAsyncSelection = @'
                  // The legacy compatibility wheel intentionally uses the
                  // synchronous backend path on Intel Xe.
                  device->support_async = false;
                  GGML_LOG_INFO("[vulkan-legacy5] async backend disabled\n");
          '@

          if (-not $vulkanSource.Contains($oldVkAsyncSelection)) {
            throw "Expected Vulkan async-selection implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkAsyncSelection, $legacyVkAsyncSelection)

          $oldVkFeaturesQuery = @'
                  vkGetPhysicalDeviceFeatures2(device->physical_device, &device_features2);

                  device->pipeline_executable_properties_support = pipeline_executable_properties_support;
          '@

          $legacyVkFeaturesQuery = @'
                  GGML_LOG_INFO("[vulkan-legacy5] physical features query begin\n");
                  vkGetPhysicalDeviceFeatures2(device->physical_device, &device_features2);
                  GGML_LOG_INFO("[vulkan-legacy5] physical features query complete\n");

                  device->pipeline_executable_properties_support = pipeline_executable_properties_support;
          '@

          if (-not $vulkanSource.Contains($oldVkFeaturesQuery)) {
            throw "Expected Vulkan physical-features query was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkFeaturesQuery, $legacyVkFeaturesQuery)

          $oldVkCreateDevice = @'
                  device_create_info.setPNext(&device_features2);
                  device->device = device->physical_device.createDevice(device_create_info);

                  // Queues
                  ggml_vk_create_queue(device, device->compute_queue, compute_queue_family_index, 0, { vk::PipelineStageFlagBits::eComputeShader | vk::PipelineStageFlagBits::eTransfer }, false);
          '@

          $legacyVkCreateDevice = @'
                  device_create_info.setPNext(&device_features2);
                  GGML_LOG_INFO("[vulkan-legacy5] logical device creation begin: extensions=%zu\n",
                                device_extensions.size());
                  device->device = device->physical_device.createDevice(device_create_info);
                  GGML_LOG_INFO("[vulkan-legacy5] logical device creation complete\n");

                  // Queues
                  GGML_LOG_INFO("[vulkan-legacy5] compute queue creation begin\n");
                  ggml_vk_create_queue(device, device->compute_queue, compute_queue_family_index, 0, { vk::PipelineStageFlagBits::eComputeShader | vk::PipelineStageFlagBits::eTransfer }, false);
                  GGML_LOG_INFO("[vulkan-legacy5] compute queue creation complete\n");
          '@

          if (-not $vulkanSource.Contains($oldVkCreateDevice)) {
            throw "Expected Vulkan logical-device creation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkCreateDevice, $legacyVkCreateDevice)

          $oldVkDescriptorAndShaders = @'
                  device->dsl = device->device.createDescriptorSetLayout(descriptor_set_layout_create_info);

                  ggml_vk_load_shaders(device);
          '@

          $legacyVkDescriptorAndShaders = @'
                  GGML_LOG_INFO("[vulkan-legacy5] descriptor layout creation begin\n");
                  device->dsl = device->device.createDescriptorSetLayout(descriptor_set_layout_create_info);
                  GGML_LOG_INFO("[vulkan-legacy5] descriptor layout creation complete\n");

                  GGML_LOG_INFO("[vulkan-legacy5] shader loading begin\n");
                  ggml_vk_load_shaders(device);
                  GGML_LOG_INFO("[vulkan-legacy5] shader loading complete\n");
          '@

          if (-not $vulkanSource.Contains($oldVkDescriptorAndShaders)) {
            throw "Expected Vulkan descriptor/shader initialization was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkDescriptorAndShaders, $legacyVkDescriptorAndShaders)

          $oldVkBufferTypeConstruction = @'
                  device->buffer_type = {
                      /* .iface    = */ ggml_backend_vk_buffer_type_interface,
                      /* .device   = */ ggml_backend_reg_dev_get(ggml_backend_vk_reg(), idx),
                      /* .context  = */ new ggml_backend_vk_buffer_type_context{ device->name, device },
                  };
          '@

          $legacyVkBufferTypeConstruction = @'
                  // The registry device is not available until ggml_vk_get_device() returns.
                  // Leave this temporarily unbound instead of recursively entering the
                  // registry while the Vulkan device and its buffer type are being built.
                  GGML_LOG_INFO("[vulkan-legacy5] raw buffer type construction begin: index=%zu\n", idx);
                  device->buffer_type = {
                      /* .iface    = */ ggml_backend_vk_buffer_type_interface,
                      /* .device   = */ nullptr,
                      /* .context  = */ new ggml_backend_vk_buffer_type_context{ device->name, device },
                  };
                  GGML_LOG_INFO("[vulkan-legacy5] raw buffer type constructed: buft=%p context=%p device=%p\n",
                                (void *) &device->buffer_type,
                                (void *) device->buffer_type.context,
                                (void *) device->buffer_type.device);
          '@

          if (-not $vulkanSource.Contains($oldVkBufferTypeConstruction)) {
            throw "Expected recursive Vulkan buffer-type construction was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkBufferTypeConstruction, $legacyVkBufferTypeConstruction)

          $oldBackendInit = @'
          ggml_backend_t ggml_backend_vk_init(size_t dev_num) {
              VK_LOG_DEBUG("ggml_backend_vk_init(" << dev_num << ")");

              ggml_backend_vk_context * ctx = new ggml_backend_vk_context;
              ggml_vk_init(ctx, dev_num);

              ggml_backend_t vk_backend = new ggml_backend {
                  /* .guid    = */ ggml_backend_vk_guid(),
                  /* .iface   = */ ggml_backend_vk_interface,
                  /* .device  = */ ggml_backend_reg_dev_get(ggml_backend_vk_reg(), dev_num),
                  /* .context = */ ctx,
              };

              if (!ctx->device->support_async) {
                  vk_backend->iface.get_tensor_async = nullptr;
              }

              return vk_backend;
          }
          '@

          $legacyBackendInit = @'
          // Internal path used when the backend registry has already resolved the
          // device. Passing that device through avoids a second registry traversal.
          static ggml_backend_t ggml_backend_vk_init_with_device(size_t dev_num, ggml_backend_dev_t backend_device) {
              GGML_LOG_INFO("[vulkan-legacy5] backend init begin: index=%zu device=%p\n", dev_num, (void *) backend_device);

              ggml_backend_vk_context * ctx = new ggml_backend_vk_context;
              GGML_LOG_INFO("[vulkan-legacy5] backend context allocated: ctx=%p\n", (void *) ctx);
              ggml_vk_init(ctx, dev_num);
              GGML_ASSERT(ctx->device);
              GGML_LOG_INFO("[vulkan-legacy5] ggml_vk_init complete: vk_device=%p\n", (void *) ctx->device.get());

              // ggml_vk_get_device() now returns without a recursive registry
              // lookup. Bind its buffer type to the device already resolved by
              // the caller before any backend allocation can use it.
              ctx->device->buffer_type.device = backend_device;
              GGML_LOG_INFO("[vulkan-legacy5] backend buffer type bound: buft=%p device=%p\n",
                            (void *) &ctx->device->buffer_type,
                            (void *) ctx->device->buffer_type.device);

              ggml_backend_t vk_backend = new ggml_backend {
                  /* .guid    = */ ggml_backend_vk_guid(),
                  /* .iface   = */ ggml_backend_vk_interface,
                  /* .device  = */ backend_device,
                  /* .context = */ ctx,
              };
              GGML_LOG_INFO("[vulkan-legacy5] backend object allocated: backend=%p device=%p\n", (void *) vk_backend, (void *) vk_backend->device);

              if (!ctx->device->support_async) {
                  vk_backend->iface.get_tensor_async = nullptr;
              }

              GGML_LOG_INFO("[vulkan-legacy5] backend init complete\n");
              return vk_backend;
          }

          ggml_backend_t ggml_backend_vk_init(size_t dev_num) {
              GGML_LOG_INFO("[vulkan-legacy5] public backend init resolving registry device: index=%zu\n", dev_num);
              ggml_backend_dev_t backend_device = ggml_backend_reg_dev_get(ggml_backend_vk_reg(), dev_num);
              GGML_LOG_INFO("[vulkan-legacy5] public backend init resolved device=%p\n", (void *) backend_device);
              return ggml_backend_vk_init_with_device(dev_num, backend_device);
          }
          '@

          if (-not $vulkanSource.Contains($oldBackendInit)) {
            throw "Expected Vulkan backend initialization implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldBackendInit, $legacyBackendInit)

          $oldDeviceBufferType = @'
          static ggml_backend_buffer_type_t ggml_backend_vk_device_get_buffer_type(ggml_backend_dev_t dev) {
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *)dev->context;
              return ggml_backend_vk_buffer_type(ctx->device);
          }
          '@

          $legacyDeviceBufferType = @'
          static ggml_backend_buffer_type_t ggml_backend_vk_device_get_buffer_type(ggml_backend_dev_t dev) {
              GGML_LOG_INFO("[vulkan-legacy5] buffer type lookup begin: dev=%p\n", (void *) dev);
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *) dev->context;
              GGML_LOG_INFO("[vulkan-legacy5] buffer type context: ctx=%p index=%zu\n", (void *) ctx, ctx->device);
              ggml_backend_buffer_type_t buffer_type = ggml_backend_vk_buffer_type(ctx->device);
              GGML_ASSERT(buffer_type);
              buffer_type->device = dev;
              GGML_LOG_INFO("[vulkan-legacy5] buffer type lookup complete and bound: buft=%p context=%p device=%p\n",
                            (void *) buffer_type,
                            (void *) buffer_type->context,
