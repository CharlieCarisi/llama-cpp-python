name: Build legacy Intel Vulkan compatibility wheel

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_VERSION: "0.3.34"
  PACKAGE_VERSION: "0.3.34+win.srw.vulkan.xelegacy8"
  VULKAN_SDK_VERSION: "1.4.341.0"

jobs:
  build:
    name: legacy-vulkan-irisxe
    runs-on: windows-2022

    steps:
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python 3.9 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version="$env:VULKAN_SDK_VERSION" --no-progress -y
          $sdk = Join-Path "C:\VulkanSDK" $env:VULKAN_SDK_VERSION
          if (-not (Test-Path $sdk)) {
            throw "Vulkan SDK was not found at $sdk"
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          & "$sdk\Bin\glslc.exe" --version

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install build wheel ninja

      - name: Clone exact upstream release
        shell: pwsh
        run: |
          $tag = "v$env:SOURCE_VERSION"
          git clone --branch $tag --depth 1 --recurse-submodules --shallow-submodules https://github.com/abetlen/llama-cpp-python.git src
          git -C src rev-parse HEAD
          git -C src submodule status

      - name: Apply monolithic layout and Windows compatibility fixes
        shell: pwsh
        run: |
          $pythonCmakePath = "src\CMakeLists.txt"
          $pythonCmake = Get-Content $pythonCmakePath -Raw
          $sharedSetting = 'set(BUILD_SHARED_LIBS "On")'
          if (-not $pythonCmake.Contains($sharedSetting)) {
            throw "Expected BUILD_SHARED_LIBS setting was not found"
          }
          $pythonCmake = $pythonCmake.Replace(
            $sharedSetting,
            'set(BUILD_SHARED_LIBS "Off")'
          )

          $ggmlRuntimeInstalls = [regex]'(?ms)\s*install\(\s*FILES \$<TARGET_RUNTIME_DLLS:ggml>\s*DESTINATION [^\r\n]+\s*\)'
          $ggmlRuntimeInstallMatches = $ggmlRuntimeInstalls.Matches($pythonCmake)
          if ($ggmlRuntimeInstallMatches.Count -ne 2) {
            throw "Expected two ggml runtime-DLL install rules, found $($ggmlRuntimeInstallMatches.Count)"
          }
          $pythonCmake = $ggmlRuntimeInstalls.Replace($pythonCmake, "")
          Set-Content $pythonCmakePath $pythonCmake -Encoding UTF8

          $llamaCmakePath = "src\vendor\llama.cpp\src\CMakeLists.txt"
          $llamaCmake = Get-Content $llamaCmakePath -Raw
          $addLlama = [regex]'add_library\(llama\s*\r?\n'
          if (-not $addLlama.IsMatch($llamaCmake)) {
            throw "Expected add_library(llama) declaration was not found"
          }
          $llamaCmake = $addLlama.Replace(
            $llamaCmake,
            "add_library(llama SHARED`r`n",
            1
          )
          Set-Content $llamaCmakePath $llamaCmake -Encoding UTF8

          $threadingPath = "src\vendor\llama.cpp\ggml\src\ggml-threading.cpp"
          $threadingSource = Get-Content $threadingPath -Raw
          $oldThreading = @'
          #include "ggml-threading.h"
          #include <mutex>

          std::mutex ggml_critical_section_mutex;

          void ggml_critical_section_start() {
              ggml_critical_section_mutex.lock();
          }

          void ggml_critical_section_end(void) {
              ggml_critical_section_mutex.unlock();
          }
          '@

          $srwThreading = @'
          #include "ggml-threading.h"

          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>

          static SRWLOCK ggml_critical_section_lock = SRWLOCK_INIT;

          void ggml_critical_section_start(void) {
              AcquireSRWLockExclusive(&ggml_critical_section_lock);
          }

          void ggml_critical_section_end(void) {
              ReleaseSRWLockExclusive(&ggml_critical_section_lock);
          }
          '@

          if (-not $threadingSource.Contains($oldThreading)) {
            throw "Expected ggml-threading.cpp implementation was not found"
          }
          $threadingSource = $threadingSource.Replace($oldThreading, $srwThreading)
          Set-Content $threadingPath $threadingSource -Encoding UTF8

          $vulkanPath = "src\vendor\llama.cpp\ggml\src\ggml-vulkan\ggml-vulkan.cpp"
          $vulkanSource = Get-Content $vulkanPath -Raw
          $oldRegistry = @'
          static ggml_backend_dev_t ggml_backend_vk_reg_get_device(ggml_backend_reg_t reg, size_t device) {
              static std::vector<ggml_backend_dev_t> devices;

              static bool initialized = false;

              {
                  static std::mutex mutex;
                  std::lock_guard<std::mutex> lock(mutex);
                  if (!initialized) {
                      const int min_batch_size = getenv("GGML_OP_OFFLOAD_MIN_BATCH") ? atoi(getenv("GGML_OP_OFFLOAD_MIN_BATCH")) : 32;
                      for (int i = 0; i < ggml_backend_vk_get_device_count(); i++) {
                          ggml_backend_vk_device_context * ctx = new ggml_backend_vk_device_context;
                          char desc[256];
                          ggml_backend_vk_get_device_description(i, desc, sizeof(desc));
                          ctx->device = i;
                          ctx->name = GGML_VK_NAME + std::to_string(i);
                          ctx->description = desc;
                          ctx->is_integrated_gpu = ggml_backend_vk_get_device_type(i) == vk::PhysicalDeviceType::eIntegratedGpu;
                          ctx->pci_bus_id = ggml_backend_vk_get_device_pci_id(i);
                          ctx->op_offload_min_batch_size = min_batch_size;
                          devices.push_back(new ggml_backend_device {
                              /* .iface   = */ ggml_backend_vk_device_i,
                              /* .reg     = */ reg,
                              /* .context = */ ctx,
                          });
                      }
                      initialized = true;
                  }
              }

              GGML_ASSERT(device < devices.size());
              return devices[device];
          }
          '@

          $legacyRegistry = @'
          // Keep registry state in zero-initialized POD values. This avoids the
          // function-local std::vector and std::mutex initialization paths that
          // fault on the target Windows/Python 3.9 + legacy Intel driver stack.
          static SRWLOCK ggml_backend_vk_devices_lock = SRWLOCK_INIT;
          static ggml_backend_dev_t * ggml_backend_vk_devices = nullptr;
          static size_t ggml_backend_vk_devices_count = 0;
          static bool ggml_backend_vk_devices_initialized = false;

          struct ggml_vk_srwlock_guard {
              SRWLOCK * lock;

              explicit ggml_vk_srwlock_guard(SRWLOCK * lock) : lock(lock) {
                  AcquireSRWLockExclusive(lock);
              }

              ~ggml_vk_srwlock_guard() {
                  ReleaseSRWLockExclusive(lock);
              }
          };

          static ggml_backend_dev_t ggml_backend_vk_reg_get_device(ggml_backend_reg_t reg, size_t device) {
              GGML_LOG_INFO("[vulkan-legacy] registry lock begin\n");
              ggml_vk_srwlock_guard lock(&ggml_backend_vk_devices_lock);
              GGML_LOG_INFO("[vulkan-legacy] registry lock acquired\n");

              if (!ggml_backend_vk_devices_initialized) {
                  const size_t count = ggml_backend_vk_get_device_count();
                  GGML_LOG_INFO("[vulkan-legacy] allocating registry for %zu device(s)\n", count);
                  ggml_backend_vk_devices = new ggml_backend_dev_t[count] {};

                  const int min_batch_size = getenv("GGML_OP_OFFLOAD_MIN_BATCH") ? atoi(getenv("GGML_OP_OFFLOAD_MIN_BATCH")) : 32;
                  for (size_t i = 0; i < count; i++) {
                      ggml_backend_vk_device_context * ctx = new ggml_backend_vk_device_context;
                      char desc[256];
                      ggml_backend_vk_get_device_description(i, desc, sizeof(desc));
                      ctx->device = i;
                      ctx->name = GGML_VK_NAME + std::to_string(i);
                      ctx->description = desc;
                      ctx->is_integrated_gpu = ggml_backend_vk_get_device_type(i) == vk::PhysicalDeviceType::eIntegratedGpu;
                      ctx->pci_bus_id = ggml_backend_vk_get_device_pci_id(i);
                      ctx->op_offload_min_batch_size = min_batch_size;
                      ggml_backend_vk_devices[i] = new ggml_backend_device {
                          /* .iface   = */ ggml_backend_vk_device_i,
                          /* .reg     = */ reg,
                          /* .context = */ ctx,
                      };
                  }
                  ggml_backend_vk_devices_count = count;
                  ggml_backend_vk_devices_initialized = true;
                  GGML_LOG_INFO("[vulkan-legacy] registry initialized\n");
              }

              GGML_ASSERT(device < ggml_backend_vk_devices_count);
              GGML_LOG_INFO("[vulkan-legacy5] registry return: index=%zu count=%zu device=%p\n",
                            device,
                            ggml_backend_vk_devices_count,
                            (void *) ggml_backend_vk_devices[device]);
              return ggml_backend_vk_devices[device];
          }
          '@

          if (-not $vulkanSource.Contains($oldRegistry)) {
            throw "Expected Vulkan registry implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldRegistry, $legacyRegistry)

          # Use the smallest practical Vulkan feature surface on the target
          # 2022 Intel Xe driver and add checkpoints inside full device creation.
          $oldVkDeviceEntry = @'
          static vk_device ggml_vk_get_device(size_t idx) {
              VK_LOG_DEBUG("ggml_vk_get_device(" << idx << ")");

              if (vk_instance.devices[idx] == nullptr) {
                  VK_LOG_DEBUG("Initializing new vk_device");
                  vk_device device = std::make_shared<vk_device_struct>();
                  vk_instance.devices[idx] = device;

                  device->memory_logger = std::unique_ptr<vk_memory_logger>(new vk_memory_logger());

                  size_t dev_num = vk_instance.device_indices[idx];

                  std::vector<vk::PhysicalDevice> physical_devices = vk_instance.instance.enumeratePhysicalDevices();
          '@

          $legacyVkDeviceEntry = @'
          static vk_device ggml_vk_get_device(size_t idx) {
              VK_LOG_DEBUG("ggml_vk_get_device(" << idx << ")");
              GGML_LOG_INFO("[vulkan-legacy5] device init entry: index=%zu selected_count=%zu\n",
                            idx, vk_instance.device_indices.size());
              GGML_ASSERT(idx < GGML_VK_MAX_DEVICES);
              GGML_ASSERT(idx < vk_instance.device_indices.size());
              GGML_LOG_INFO("[vulkan-legacy5] device cache probe begin\n");

              if (vk_instance.devices[idx] == nullptr) {
                  GGML_LOG_INFO("[vulkan-legacy5] device cache empty; allocating device state\n");
                  vk_device device = std::make_shared<vk_device_struct>();
                  vk_instance.devices[idx] = device;
                  GGML_LOG_INFO("[vulkan-legacy5] device state allocated: device=%p\n", (void *) device.get());

                  device->memory_logger = std::unique_ptr<vk_memory_logger>(new vk_memory_logger());
                  GGML_LOG_INFO("[vulkan-legacy5] memory logger allocated\n");

                  size_t dev_num = vk_instance.device_indices[idx];
                  GGML_LOG_INFO("[vulkan-legacy5] physical device ordinal=%zu\n", dev_num);

                  GGML_LOG_INFO("[vulkan-legacy5] physical device enumeration begin\n");
                  std::vector<vk::PhysicalDevice> physical_devices = vk_instance.instance.enumeratePhysicalDevices();
                  GGML_LOG_INFO("[vulkan-legacy5] physical device enumeration complete: count=%zu\n",
                                physical_devices.size());
          '@

          if (-not $vulkanSource.Contains($oldVkDeviceEntry)) {
            throw "Expected Vulkan device-entry implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkDeviceEntry, $legacyVkDeviceEntry)

          $oldVkPhysicalDeviceSetup = @'
                  device->physical_device = physical_devices[dev_num];
                  const std::vector<vk::ExtensionProperties> ext_props = device->physical_device.enumerateDeviceExtensionProperties();

                  device->architecture = get_device_architecture(device->physical_device);
          '@

          $legacyVkPhysicalDeviceSetup = @'
                  device->physical_device = physical_devices[dev_num];
                  GGML_LOG_INFO("[vulkan-legacy5] extension enumeration begin\n");
                  const std::vector<vk::ExtensionProperties> ext_props = device->physical_device.enumerateDeviceExtensionProperties();
                  GGML_LOG_INFO("[vulkan-legacy5] extension enumeration complete: count=%zu\n", ext_props.size());

                  device->architecture = get_device_architecture(device->physical_device);
                  GGML_LOG_INFO("[vulkan-legacy5] architecture resolved: value=%d\n", (int) device->architecture);
          '@

          if (-not $vulkanSource.Contains($oldVkPhysicalDeviceSetup)) {
            throw "Expected Vulkan physical-device setup was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPhysicalDeviceSetup, $legacyVkPhysicalDeviceSetup)

          $oldVkPropertiesAnchor = @'
                  }

                  vk::PhysicalDeviceProperties2 props2;
                  vk::PhysicalDeviceMaintenance3Properties props3;
          '@

          $legacyVkPropertiesAnchor = @'
                  }

                  // Legacy Intel compatibility profile. Keep required 16-bit
                  // storage and FP16, but do not enable optional extension paths
                  // known to vary substantially across old Windows drivers.
                  maintenance4_support = false;
                  sm_builtins = false;
                  amd_shader_core_properties2 = false;
                  pipeline_robustness = false;
                  coopmat2_support = false;
                  coopmat2_decode_vector_support = false;
                  pipeline_executable_properties_support = false;
                  device->subgroup_size_control = false;
                  device->coopmat_support = false;
                  device->integer_dot_product = false;
                  device->external_memory_host = false;
                  device->shader_64b_indexing = false;
                  device->memory_priority = false;
                  bfloat16_support = false;
                  dot2_f16_support = false;
                  GGML_LOG_INFO("[vulkan-legacy5] minimal Intel feature profile applied\n");

                  vk::PhysicalDeviceProperties2 props2;
                  vk::PhysicalDeviceMaintenance3Properties props3;
          '@

          if (-not $vulkanSource.Contains($oldVkPropertiesAnchor)) {
            throw "Expected Vulkan properties anchor was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPropertiesAnchor, $legacyVkPropertiesAnchor)

          $oldVkPropertiesQuery = @'
                  device->physical_device.getProperties2(&props2);
                  device->properties = props2.properties;
          '@

          $legacyVkPropertiesQuery = @'
                  GGML_LOG_INFO("[vulkan-legacy5] physical properties query begin\n");
                  device->physical_device.getProperties2(&props2);
                  GGML_LOG_INFO("[vulkan-legacy5] physical properties query complete\n");
                  device->properties = props2.properties;
          '@

          if (-not $vulkanSource.Contains($oldVkPropertiesQuery)) {
            throw "Expected Vulkan physical-properties query was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPropertiesQuery, $legacyVkPropertiesQuery)

          $oldVkAsyncSelection = @'
                  device->support_async = (device->vendor_id != VK_VENDOR_ID_INTEL ||
                                           std::string(device->properties.deviceName.data()).find("(DG1)") == std::string::npos) &&
                                          getenv("GGML_VK_DISABLE_ASYNC") == nullptr;
          '@

          $legacyVkAsyncSelection = @'
                  // The legacy compatibility wheel intentionally uses the
                  // synchronous backend path on Intel Xe.
                  device->support_async = false;
                  GGML_LOG_INFO("[vulkan-legacy5] async backend disabled\n");
          '@

          if (-not $vulkanSource.Contains($oldVkAsyncSelection)) {
            throw "Expected Vulkan async-selection implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkAsyncSelection, $legacyVkAsyncSelection)

          $oldVkFeaturesQuery = @'
                  vkGetPhysicalDeviceFeatures2(device->physical_device, &device_features2);

                  device->pipeline_executable_properties_support = pipeline_executable_properties_support;
          '@

          $legacyVkFeaturesQuery = @'
                  GGML_LOG_INFO("[vulkan-legacy5] physical features query begin\n");
                  vkGetPhysicalDeviceFeatures2(device->physical_device, &device_features2);
                  GGML_LOG_INFO("[vulkan-legacy5] physical features query complete\n");

                  device->pipeline_executable_properties_support = pipeline_executable_properties_support;
          '@

          if (-not $vulkanSource.Contains($oldVkFeaturesQuery)) {
            throw "Expected Vulkan physical-features query was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkFeaturesQuery, $legacyVkFeaturesQuery)

          $oldVkCreateDevice = @'
                  device_create_info.setPNext(&device_features2);
                  device->device = device->physical_device.createDevice(device_create_info);

                  // Queues
                  ggml_vk_create_queue(device, device->compute_queue, compute_queue_family_index, 0, { vk::PipelineStageFlagBits::eComputeShader | vk::PipelineStageFlagBits::eTransfer }, false);
          '@

          $legacyVkCreateDevice = @'
                  device_create_info.setPNext(&device_features2);
                  GGML_LOG_INFO("[vulkan-legacy5] logical device creation begin: extensions=%zu\n",
                                device_extensions.size());
                  device->device = device->physical_device.createDevice(device_create_info);
                  GGML_LOG_INFO("[vulkan-legacy5] logical device creation complete\n");

                  // Queues
                  GGML_LOG_INFO("[vulkan-legacy5] compute queue creation begin\n");
                  ggml_vk_create_queue(device, device->compute_queue, compute_queue_family_index, 0, { vk::PipelineStageFlagBits::eComputeShader | vk::PipelineStageFlagBits::eTransfer }, false);
                  GGML_LOG_INFO("[vulkan-legacy5] compute queue creation complete\n");
          '@

          if (-not $vulkanSource.Contains($oldVkCreateDevice)) {
            throw "Expected Vulkan logical-device creation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkCreateDevice, $legacyVkCreateDevice)

          $oldVkDescriptorAndShaders = @'
                  device->dsl = device->device.createDescriptorSetLayout(descriptor_set_layout_create_info);

                  ggml_vk_load_shaders(device);
          '@

          $legacyVkDescriptorAndShaders = @'
                  GGML_LOG_INFO("[vulkan-legacy5] descriptor layout creation begin\n");
                  device->dsl = device->device.createDescriptorSetLayout(descriptor_set_layout_create_info);
                  GGML_LOG_INFO("[vulkan-legacy5] descriptor layout creation complete\n");

                  GGML_LOG_INFO("[vulkan-legacy5] shader loading begin\n");
                  ggml_vk_load_shaders(device);
                  GGML_LOG_INFO("[vulkan-legacy5] shader loading complete\n");
          '@

          if (-not $vulkanSource.Contains($oldVkDescriptorAndShaders)) {
            throw "Expected Vulkan descriptor/shader initialization was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkDescriptorAndShaders, $legacyVkDescriptorAndShaders)

          $oldVkBufferTypeConstruction = @'
                  device->buffer_type = {
                      /* .iface    = */ ggml_backend_vk_buffer_type_interface,
                      /* .device   = */ ggml_backend_reg_dev_get(ggml_backend_vk_reg(), idx),
                      /* .context  = */ new ggml_backend_vk_buffer_type_context{ device->name, device },
                  };
          '@

          $legacyVkBufferTypeConstruction = @'
                  // The registry device is not available until ggml_vk_get_device() returns.
                  // Leave this temporarily unbound instead of recursively entering the
                  // registry while the Vulkan device and its buffer type are being built.
                  GGML_LOG_INFO("[vulkan-legacy5] raw buffer type construction begin: index=%zu\n", idx);
                  device->buffer_type = {
                      /* .iface    = */ ggml_backend_vk_buffer_type_interface,
                      /* .device   = */ nullptr,
                      /* .context  = */ new ggml_backend_vk_buffer_type_context{ device->name, device },
                  };
                  GGML_LOG_INFO("[vulkan-legacy5] raw buffer type constructed: buft=%p context=%p device=%p\n",
                                (void *) &device->buffer_type,
                                (void *) device->buffer_type.context,
                                (void *) device->buffer_type.device);
          '@

          if (-not $vulkanSource.Contains($oldVkBufferTypeConstruction)) {
            throw "Expected recursive Vulkan buffer-type construction was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkBufferTypeConstruction, $legacyVkBufferTypeConstruction)

          $oldBackendInit = @'
          ggml_backend_t ggml_backend_vk_init(size_t dev_num) {
              VK_LOG_DEBUG("ggml_backend_vk_init(" << dev_num << ")");

              ggml_backend_vk_context * ctx = new ggml_backend_vk_context;
              ggml_vk_init(ctx, dev_num);

              ggml_backend_t vk_backend = new ggml_backend {
                  /* .guid    = */ ggml_backend_vk_guid(),
                  /* .iface   = */ ggml_backend_vk_interface,
                  /* .device  = */ ggml_backend_reg_dev_get(ggml_backend_vk_reg(), dev_num),
                  /* .context = */ ctx,
              };

              if (!ctx->device->support_async) {
                  vk_backend->iface.get_tensor_async = nullptr;
              }

              return vk_backend;
          }
          '@

          $legacyBackendInit = @'
          // Internal path used when the backend registry has already resolved the
          // device. Passing that device through avoids a second registry traversal.
          static ggml_backend_t ggml_backend_vk_init_with_device(size_t dev_num, ggml_backend_dev_t backend_device) {
              GGML_LOG_INFO("[vulkan-legacy5] backend init begin: index=%zu device=%p\n", dev_num, (void *) backend_device);

              ggml_backend_vk_context * ctx = new ggml_backend_vk_context;
              GGML_LOG_INFO("[vulkan-legacy5] backend context allocated: ctx=%p\n", (void *) ctx);
              ggml_vk_init(ctx, dev_num);
              GGML_ASSERT(ctx->device);
              GGML_LOG_INFO("[vulkan-legacy5] ggml_vk_init complete: vk_device=%p\n", (void *) ctx->device.get());

              // ggml_vk_get_device() now returns without a recursive registry
              // lookup. Bind its buffer type to the device already resolved by
              // the caller before any backend allocation can use it.
              ctx->device->buffer_type.device = backend_device;
              GGML_LOG_INFO("[vulkan-legacy5] backend buffer type bound: buft=%p device=%p\n",
                            (void *) &ctx->device->buffer_type,
                            (void *) ctx->device->buffer_type.device);

              ggml_backend_t vk_backend = new ggml_backend {
                  /* .guid    = */ ggml_backend_vk_guid(),
                  /* .iface   = */ ggml_backend_vk_interface,
                  /* .device  = */ backend_device,
                  /* .context = */ ctx,
              };
              GGML_LOG_INFO("[vulkan-legacy5] backend object allocated: backend=%p device=%p\n", (void *) vk_backend, (void *) vk_backend->device);

              if (!ctx->device->support_async) {
                  vk_backend->iface.get_tensor_async = nullptr;
              }

              GGML_LOG_INFO("[vulkan-legacy5] backend init complete\n");
              return vk_backend;
          }

          ggml_backend_t ggml_backend_vk_init(size_t dev_num) {
              GGML_LOG_INFO("[vulkan-legacy5] public backend init resolving registry device: index=%zu\n", dev_num);
              ggml_backend_dev_t backend_device = ggml_backend_reg_dev_get(ggml_backend_vk_reg(), dev_num);
              GGML_LOG_INFO("[vulkan-legacy5] public backend init resolved device=%p\n", (void *) backend_device);
              return ggml_backend_vk_init_with_device(dev_num, backend_device);
          }
          '@

          if (-not $vulkanSource.Contains($oldBackendInit)) {
            throw "Expected Vulkan backend initialization implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldBackendInit, $legacyBackendInit)

          $oldDeviceBufferType = @'
          static ggml_backend_buffer_type_t ggml_backend_vk_device_get_buffer_type(ggml_backend_dev_t dev) {
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *)dev->context;
              return ggml_backend_vk_buffer_type(ctx->device);
          }
          '@

          $legacyDeviceBufferType = @'
          static ggml_backend_buffer_type_t ggml_backend_vk_device_get_buffer_type(ggml_backend_dev_t dev) {
              GGML_LOG_INFO("[vulkan-legacy5] buffer type lookup begin: dev=%p\n", (void *) dev);
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *) dev->context;
              GGML_LOG_INFO("[vulkan-legacy5] buffer type context: ctx=%p index=%zu\n", (void *) ctx, ctx->device);
              ggml_backend_buffer_type_t buffer_type = ggml_backend_vk_buffer_type(ctx->device);
              GGML_ASSERT(buffer_type);
              buffer_type->device = dev;
              GGML_LOG_INFO("[vulkan-legacy5] buffer type lookup complete and bound: buft=%p context=%p device=%p\n",
                            (void *) buffer_type,
                            (void *) buffer_type->context,
                            (void *) buffer_type->device);
              return buffer_type;
          }
          '@

          if (-not $vulkanSource.Contains($oldDeviceBufferType)) {
            throw "Expected Vulkan device buffer-type implementation was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldDeviceBufferType, $legacyDeviceBufferType)

          $oldDeviceHostBufferType = @'
          static ggml_backend_buffer_type_t ggml_backend_vk_device_get_host_buffer_type(ggml_backend_dev_t dev) {
              UNUSED(dev);
              return ggml_backend_vk_host_buffer_type();
          }
          '@

          $legacyDeviceHostBufferType = @'
          // The pinned Vulkan host-buffer singleton recursively enters the
          // backend registry during model tensor placement on the legacy
          // Intel stack. Returning nullptr is supported by make_cpu_buft_list(),
          // which then appends the ordinary CPU host buffer while retaining
          // Vulkan model-layer offload.
          static ggml_backend_buffer_type_t ggml_backend_vk_device_get_host_buffer_type(ggml_backend_dev_t dev) {
              UNUSED(dev);
              GGML_LOG_INFO("[vulkan-legacy5] pinned host buffer disabled; using CPU host-buffer fallback\n");
              return nullptr;
          }
          '@

          if (-not $vulkanSource.Contains($oldDeviceHostBufferType)) {
            throw "Expected Vulkan host-buffer type getter was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldDeviceHostBufferType, $legacyDeviceHostBufferType)

          $oldHostBufferCapability = '        /* .host_buffer           = */ true,'
          $newHostBufferCapability = '        /* .host_buffer           = */ false,'
          $hostBufferCapabilityMatches = ([regex]::Matches($vulkanSource, [regex]::Escape($oldHostBufferCapability))).Count
          if ($hostBufferCapabilityMatches -ne 1) {
            throw "Expected one Vulkan host-buffer capability, found $hostBufferCapabilityMatches"
          }
          $vulkanSource = $vulkanSource.Replace($oldHostBufferCapability, $newHostBufferCapability)

          # Replace the per-device std::recursive_mutex used by Vulkan queue
          # and transfer operations. CRITICAL_SECTION preserves same-thread
          # recursion without relying on the failing MSVC mutex implementation.
          $oldVkRecursiveMutex = @'
          struct vk_device_struct {
              std::recursive_mutex mutex;
              mutable std::shared_mutex pinned_memory_mutex;
          '@

          $legacyVkRecursiveMutex = @'
          #if defined(_WIN32)
          struct ggml_vk_recursive_mutex {
              CRITICAL_SECTION section;

              ggml_vk_recursive_mutex() {
                  InitializeCriticalSection(&section);
              }

              ~ggml_vk_recursive_mutex() {
                  DeleteCriticalSection(&section);
              }

              ggml_vk_recursive_mutex(const ggml_vk_recursive_mutex &) = delete;
              ggml_vk_recursive_mutex & operator=(const ggml_vk_recursive_mutex &) = delete;

              void lock() {
                  EnterCriticalSection(&section);
              }

              void unlock() {
                  LeaveCriticalSection(&section);
              }
          };
          #else
          using ggml_vk_recursive_mutex = std::recursive_mutex;
          #endif

          struct vk_device_struct {
              ggml_vk_recursive_mutex mutex;
              mutable std::shared_mutex pinned_memory_mutex;
          '@

          if (-not $vulkanSource.Contains($oldVkRecursiveMutex)) {
            throw "Expected Vulkan per-device recursive mutex declaration was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkRecursiveMutex, $legacyVkRecursiveMutex)

          $oldVkRecursiveGuard = 'std::lock_guard<std::recursive_mutex>'
          $legacyVkRecursiveGuard = 'std::lock_guard<ggml_vk_recursive_mutex>'
          $recursiveGuardMatches = ([regex]::Matches($vulkanSource, [regex]::Escape($oldVkRecursiveGuard))).Count
          if ($recursiveGuardMatches -ne 6) {
            throw "Expected six Vulkan recursive-mutex guards, found $recursiveGuardMatches"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkRecursiveGuard, $legacyVkRecursiveGuard)

          $oldVkCreateQueueHelper = @'
          static void ggml_vk_create_queue(vk_device& device, vk_queue& q, uint32_t queue_family_index, uint32_t queue_index, vk::PipelineStageFlags&& stage_flags, bool transfer_only) {
              VK_LOG_DEBUG("ggml_vk_create_queue()");
              std::lock_guard<ggml_vk_recursive_mutex> guard(device->mutex);

              q.queue_family_index = queue_family_index;
              q.transfer_only = transfer_only;

              q.cmd_pool.init(device, &q);

              q.queue = device->device.getQueue(queue_family_index, queue_index);

              q.stage_flags = stage_flags;
          }
          '@

          $legacyVkCreateQueueHelper = @'
          static void ggml_vk_create_queue(vk_device& device, vk_queue& q, uint32_t queue_family_index, uint32_t queue_index, vk::PipelineStageFlags&& stage_flags, bool transfer_only) {
              VK_LOG_DEBUG("ggml_vk_create_queue()");
              GGML_LOG_INFO("[vulkan-legacy6] queue helper entry: device=%p family=%u index=%u transfer_only=%d\n",
                            (void *) device.get(), queue_family_index, queue_index, transfer_only ? 1 : 0);
              GGML_LOG_INFO("[vulkan-legacy6] queue critical-section enter begin\n");
              std::lock_guard<ggml_vk_recursive_mutex> guard(device->mutex);
              GGML_LOG_INFO("[vulkan-legacy6] queue critical-section acquired\n");

              q.queue_family_index = queue_family_index;
              q.transfer_only = transfer_only;

              GGML_LOG_INFO("[vulkan-legacy6] command-pool init begin\n");
              q.cmd_pool.init(device, &q);
              GGML_LOG_INFO("[vulkan-legacy6] command-pool init complete\n");

              GGML_LOG_INFO("[vulkan-legacy6] queue retrieval begin\n");
              q.queue = device->device.getQueue(queue_family_index, queue_index);
              GGML_LOG_INFO("[vulkan-legacy6] queue retrieval complete\n");

              q.stage_flags = stage_flags;
              GGML_LOG_INFO("[vulkan-legacy6] queue helper complete\n");
          }
          '@

          if (-not $vulkanSource.Contains($oldVkCreateQueueHelper)) {
            throw "Expected Vulkan queue-creation helper was not found after recursive-lock replacement"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkCreateQueueHelper, $legacyVkCreateQueueHelper)

          # The shader loader uses a separate per-device std::mutex. Replace it
          # with the compatibility critical section and update all lock sites.
          $oldVkCompileMembers = @'
              std::mutex compile_mutex;
              std::condition_variable compile_cv;
          '@

          $legacyVkCompileMembers = @'
              ggml_vk_recursive_mutex compile_mutex;
              std::condition_variable_any compile_cv;
          '@

          if (-not $vulkanSource.Contains($oldVkCompileMembers)) {
            throw "Expected Vulkan compile synchronization members were not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkCompileMembers, $legacyVkCompileMembers)

          $oldVkDeviceCompileGuard = 'std::lock_guard<std::mutex> guard(device->compile_mutex);'
          $legacyVkDeviceCompileGuard = 'std::lock_guard<ggml_vk_recursive_mutex> guard(device->compile_mutex);'
          $deviceCompileGuardMatches = ([regex]::Matches($vulkanSource, [regex]::Escape($oldVkDeviceCompileGuard))).Count
          if ($deviceCompileGuardMatches -ne 1) {
            throw "Expected one direct Vulkan compile guard, found $deviceCompileGuardMatches"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkDeviceCompileGuard, $legacyVkDeviceCompileGuard)

          $oldVkContextCompileGuard = 'std::lock_guard<std::mutex> guard(ctx->device->compile_mutex);'
          $legacyVkContextCompileGuard = 'std::lock_guard<ggml_vk_recursive_mutex> guard(ctx->device->compile_mutex);'
          $contextCompileGuardMatches = ([regex]::Matches($vulkanSource, [regex]::Escape($oldVkContextCompileGuard))).Count
          if ($contextCompileGuardMatches -ne 5) {
            throw "Expected five context Vulkan compile guards, found $contextCompileGuardMatches"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkContextCompileGuard, $legacyVkContextCompileGuard)

          $oldVkCompileLock = 'std::unique_lock<std::mutex> compile_lock(device->compile_mutex);'
          $legacyVkCompileLock = 'std::unique_lock<ggml_vk_recursive_mutex> compile_lock(device->compile_mutex);'
          if (-not $vulkanSource.Contains($oldVkCompileLock)) {
            throw "Expected Vulkan shader compile lock was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkCompileLock, $legacyVkCompileLock)

          $oldVkWaitLock = 'std::unique_lock<std::mutex> wait_lock(device->compile_mutex);'
          $legacyVkWaitLock = 'std::unique_lock<ggml_vk_recursive_mutex> wait_lock(device->compile_mutex);'
          if (-not $vulkanSource.Contains($oldVkWaitLock)) {
            throw "Expected Vulkan shader wait lock was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkWaitLock, $legacyVkWaitLock)

          $oldVkShaderLoaderEntry = @'
          static void ggml_vk_load_shaders(vk_device& device, vk_pipeline requested) {
              VK_LOG_DEBUG("ggml_vk_load_shaders(" << device->name << ")");
          '@

          $legacyVkShaderLoaderEntry = @'
          static void ggml_vk_load_shaders(vk_device& device, vk_pipeline requested) {
              GGML_LOG_INFO("[vulkan-legacy7] shader loader entry: device=%p requested=%p\n",
                            (void *) device.get(), (void *) requested.get());
              VK_LOG_DEBUG("ggml_vk_load_shaders(" << device->name << ")");
          '@

          if (-not $vulkanSource.Contains($oldVkShaderLoaderEntry)) {
            throw "Expected Vulkan shader-loader entry was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkShaderLoaderEntry, $legacyVkShaderLoaderEntry)

          $oldVkShaderCompileLock = @'
              std::unique_lock<ggml_vk_recursive_mutex> compile_lock(device->compile_mutex);

              if (device->coopmat2) {
          '@

          $legacyVkShaderCompileLock = @'
              GGML_LOG_INFO("[vulkan-legacy7] compile critical-section enter begin\n");
              std::unique_lock<ggml_vk_recursive_mutex> compile_lock(device->compile_mutex);
              GGML_LOG_INFO("[vulkan-legacy7] compile critical-section acquired\n");

              if (device->coopmat2) {
          '@

          if (-not $vulkanSource.Contains($oldVkShaderCompileLock)) {
            throw "Expected Vulkan shader compile-lock site was not found after type replacement"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkShaderCompileLock, $legacyVkShaderCompileLock)

          # The old Intel driver reaches first-inference pipeline compilation
          # but faults before a pipeline is usable. Avoid the optional runtime
          # FP16 RTE SPIR-V mutation and the multi-add path that requires it.
          $oldVkFp16Rte = '        device->float_controls_rte_fp16 = vk12_props.shaderRoundingModeRTEFloat16;'
          $legacyVkFp16Rte = @'
                  // The legacy Intel driver advertises FP16 RTE support but
                  // faults while consuming the runtime-patched SPIR-V.
                  device->float_controls_rte_fp16 = false;
                  GGML_LOG_INFO("[vulkan-legacy8] runtime FP16 RTE SPIR-V rewrite disabled\n");
          '@

          if (-not $vulkanSource.Contains($oldVkFp16Rte)) {
            throw "Expected Vulkan FP16 RTE capability assignment was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkFp16Rte, $legacyVkFp16Rte)

          $oldVkMultiAdd = @'
                  device->multi_add = vk12_props.shaderRoundingModeRTEFloat16 &&
                                      device->properties.limits.maxPushConstantsSize >= sizeof(vk_op_multi_add_push_constants) &&
                                      getenv("GGML_VK_DISABLE_MULTI_ADD") == nullptr;
          '@

          $legacyVkMultiAdd = @'
                  device->multi_add = false;
                  GGML_LOG_INFO("[vulkan-legacy8] optional multi_add path disabled\n");
          '@

          if (-not $vulkanSource.Contains($oldVkMultiAdd)) {
            throw "Expected Vulkan multi_add capability assignment was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkMultiAdd, $legacyVkMultiAdd)

          # Identify the exact requested shader and separate failures in SPIR-V
          # module creation, pipeline layout, compute pipeline, and completion.
          $oldVkPipelineClaim = @'
                          has_claimed_task = true;
          '@

          $legacyVkPipelineClaim = @'
                          has_claimed_task = true;
                          GGML_LOG_INFO("[vulkan-legacy8] pipeline claimed: name=%s spv_size=%zu parameters=%u\n",
                                        pipeline->name.c_str(), spv_size, parameter_count);
          '@

          if (-not $vulkanSource.Contains($oldVkPipelineClaim)) {
            throw "Expected Vulkan pipeline-claim site was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPipelineClaim, $legacyVkPipelineClaim)

          $oldVkPipelineEntry = @'
              GGML_ASSERT(parameter_count > 0);
              GGML_ASSERT(parameter_count <= MAX_PARAMETER_COUNT);
              GGML_ASSERT(wg_denoms[0] > 0 && wg_denoms[1] > 0 && wg_denoms[2] > 0); // NOLINT
          '@

          $legacyVkPipelineEntry = @'
              GGML_LOG_INFO("[vulkan-legacy8] pipeline compile entry: name=%s spv_size=%zu entrypoint=%s parameters=%u\n",
                            pipeline->name.c_str(), spv_size, entrypoint.c_str(), parameter_count);
              GGML_ASSERT(parameter_count > 0);
              GGML_ASSERT(parameter_count <= MAX_PARAMETER_COUNT);
              GGML_ASSERT(wg_denoms[0] > 0 && wg_denoms[1] > 0 && wg_denoms[2] > 0); // NOLINT
          '@

          if (-not $vulkanSource.Contains($oldVkPipelineEntry)) {
            throw "Expected Vulkan pipeline-entry assertions were not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPipelineEntry, $legacyVkPipelineEntry)

          $oldVkShaderModuleCreate = @'
              pipeline->shader_module = device->device.createShaderModule(shader_module_create_info);
          '@

          $legacyVkShaderModuleCreate = @'
              GGML_LOG_INFO("[vulkan-legacy8] shader-module creation begin: name=%s bytes=%zu\n",
                            pipeline->name.c_str(), shader_module_create_info.codeSize);
              pipeline->shader_module = device->device.createShaderModule(shader_module_create_info);
              GGML_LOG_INFO("[vulkan-legacy8] shader-module creation complete: name=%s\n",
                            pipeline->name.c_str());
          '@

          if (-not $vulkanSource.Contains($oldVkShaderModuleCreate)) {
            throw "Expected Vulkan shader-module creation site was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkShaderModuleCreate, $legacyVkShaderModuleCreate)

          $oldVkPipelineLayoutCreate = @'
              vk::PipelineLayoutCreateInfo pipeline_layout_create_info(vk::PipelineLayoutCreateFlags(), device->dsl, pcr);
              pipeline->layout = device->device.createPipelineLayout(pipeline_layout_create_info);
          '@

          $legacyVkPipelineLayoutCreate = @'
              vk::PipelineLayoutCreateInfo pipeline_layout_create_info(vk::PipelineLayoutCreateFlags(), device->dsl, pcr);
              GGML_LOG_INFO("[vulkan-legacy8] pipeline-layout creation begin: name=%s\n",
                            pipeline->name.c_str());
              pipeline->layout = device->device.createPipelineLayout(pipeline_layout_create_info);
              GGML_LOG_INFO("[vulkan-legacy8] pipeline-layout creation complete: name=%s\n",
                            pipeline->name.c_str());
          '@

          if (-not $vulkanSource.Contains($oldVkPipelineLayoutCreate)) {
            throw "Expected Vulkan pipeline-layout creation site was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPipelineLayoutCreate, $legacyVkPipelineLayoutCreate)

          $oldVkComputePipelineCreate = @'
              try {
                  pipeline->pipeline = device->device.createComputePipeline(VK_NULL_HANDLE, compute_pipeline_create_info).value;
              } catch (const vk::SystemError& e) {
          '@

          $legacyVkComputePipelineCreate = @'
              try {
                  GGML_LOG_INFO("[vulkan-legacy8] compute-pipeline creation begin: name=%s\n",
                                pipeline->name.c_str());
                  pipeline->pipeline = device->device.createComputePipeline(VK_NULL_HANDLE, compute_pipeline_create_info).value;
                  GGML_LOG_INFO("[vulkan-legacy8] compute-pipeline creation complete: name=%s\n",
                                pipeline->name.c_str());
              } catch (const vk::SystemError& e) {
          '@

          if (-not $vulkanSource.Contains($oldVkComputePipelineCreate)) {
            throw "Expected Vulkan compute-pipeline creation site was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkComputePipelineCreate, $legacyVkComputePipelineCreate)

          $oldVkPipelineCompletion = @'
              {
                  std::lock_guard<ggml_vk_recursive_mutex> guard(device->compile_mutex);
                  device->all_pipelines.push_back(pipeline);
                  pipeline->compiled = true;
                  pipeline->compile_pending = false;
              }
              device->compile_cv.notify_all();
          '@

          $legacyVkPipelineCompletion = @'
              {
                  GGML_LOG_INFO("[vulkan-legacy8] completion critical-section enter begin: name=%s\n",
                                pipeline->name.c_str());
                  std::lock_guard<ggml_vk_recursive_mutex> guard(device->compile_mutex);
                  GGML_LOG_INFO("[vulkan-legacy8] completion critical-section acquired: name=%s\n",
                                pipeline->name.c_str());
                  device->all_pipelines.push_back(pipeline);
                  pipeline->compiled = true;
                  pipeline->compile_pending = false;
              }
              device->compile_cv.notify_all();
              GGML_LOG_INFO("[vulkan-legacy8] pipeline compilation complete: name=%s\n",
                            pipeline->name.c_str());
          '@

          if (-not $vulkanSource.Contains($oldVkPipelineCompletion)) {
            throw "Expected Vulkan pipeline-completion block was not found after compile-lock replacement"
          }
          $vulkanSource = $vulkanSource.Replace($oldVkPipelineCompletion, $legacyVkPipelineCompletion)

          $oldDeviceInit = @'
          static ggml_backend_t ggml_backend_vk_device_init(ggml_backend_dev_t dev, const char * params) {
              UNUSED(params);
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *)dev->context;
              return ggml_backend_vk_init(ctx->device);
          }
          '@

          $legacyDeviceInit = @'
          static ggml_backend_t ggml_backend_vk_device_init(ggml_backend_dev_t dev, const char * params) {
              UNUSED(params);
              GGML_LOG_INFO("[vulkan-legacy5] registry device init begin: dev=%p\n", (void *) dev);
              ggml_backend_vk_device_context * ctx = (ggml_backend_vk_device_context *) dev->context;
              GGML_LOG_INFO("[vulkan-legacy5] registry device init context: ctx=%p index=%zu\n", (void *) ctx, ctx->device);

              // The registry already supplied dev. Reuse it directly instead of
              // calling the public initializer, which resolves the registry again.
              ggml_backend_t backend = ggml_backend_vk_init_with_device(ctx->device, dev);
              GGML_LOG_INFO("[vulkan-legacy5] registry device init complete: backend=%p\n", (void *) backend);
              return backend;
          }
          '@

          if (-not $vulkanSource.Contains($oldDeviceInit)) {
            throw "Expected Vulkan registry device initializer was not found"
          }
          $vulkanSource = $vulkanSource.Replace($oldDeviceInit, $legacyDeviceInit)
          Set-Content $vulkanPath $vulkanSource -Encoding UTF8

          $initPath = "src\llama_cpp\__init__.py"
          $init = Get-Content $initPath -Raw
          $oldVersion = "__version__ = `"$env:SOURCE_VERSION`""
          $newVersion = "__version__ = `"$env:PACKAGE_VERSION`""
          if (-not $init.Contains($oldVersion)) {
            throw "Expected package version $oldVersion was not found"
          }
          $init = $init.Replace($oldVersion, $newVersion)
          Set-Content $initPath $init -Encoding UTF8

          git -C src diff -- CMakeLists.txt llama_cpp/__init__.py vendor/llama.cpp/src/CMakeLists.txt vendor/llama.cpp/ggml/src/ggml-threading.cpp vendor/llama.cpp/ggml/src/ggml-vulkan/ggml-vulkan.cpp

      - name: Configure optimized Tiger Lake and Vulkan build
        shell: pwsh
        run: |
          $flags = @(
            "-DCMAKE_BUILD_TYPE=Release",
            "-DBUILD_SHARED_LIBS=OFF",
            "-DLLAVA_BUILD=OFF",
            "-DGGML_NATIVE=OFF",
            "-DGGML_OPENMP=ON",
            "-DGGML_BACKEND_DL=OFF",
            "-DGGML_CPU_ALL_VARIANTS=OFF",
            "-DGGML_CPU_REPACK=ON",
            "-DGGML_BLAS=OFF",
            "-DGGML_CUDA=OFF",
            "-DGGML_HIP=OFF",
            "-DGGML_SYCL=OFF",
            "-DGGML_OPENCL=OFF",
            "-DGGML_RPC=OFF",
            "-DGGML_METAL=OFF",
            "-DGGML_VULKAN=ON",
            "-DGGML_SSE42=ON",
            "-DGGML_AVX=ON",
            "-DGGML_AVX2=ON",
            "-DGGML_FMA=ON",
            "-DGGML_F16C=ON",
            "-DGGML_BMI2=ON",
            "-DGGML_AVX512=ON",
            "-DGGML_AVX512_VBMI=ON",
            "-DGGML_AVX512_VNNI=ON",
            "-DGGML_AVX512_BF16=OFF",
            "-DLLAMA_BUILD_TESTS=OFF",
            "-DLLAMA_BUILD_EXAMPLES=OFF",
            "-DLLAMA_BUILD_TOOLS=OFF",
            "-DLLAMA_BUILD_SERVER=OFF"
          )

          $argsLine = $flags -join " "
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_ARGS=$argsLine" >> $env:GITHUB_ENV
          Write-Host "CMAKE_ARGS=$argsLine"

      - name: Build wheel
        shell: pwsh
        run: |
          Set-Location src
          $outDir = Join-Path $env:GITHUB_WORKSPACE "wheelhouse"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          python -m build --wheel --outdir $outDir

      - name: Verify packaging and backend initialization
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "wheelhouse\*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel was produced"
          }

          python -m venv testenv
          $testPython = Join-Path $env:GITHUB_WORKSPACE "testenv\Scripts\python.exe"
          & $testPython -m pip install --upgrade "pip<26"
          & $testPython -m pip install --no-cache-dir $wheel.FullName

          New-Item -ItemType Directory -Force reports | Out-Null

          $testOutput = @'
          import platform
          import sys

          import llama_cpp

          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("llama-cpp-python:", llama_cpp.__version__)

          print("Calling llama_backend_init()", flush=True)
          llama_cpp.llama_backend_init()
          print("BACKEND INIT OK", flush=True)
          llama_cpp.llama_backend_free()
          print("BACKEND FREE OK", flush=True)
          '@ | & $testPython -I -X faulthandler -u 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Tee-Object "reports\legacy-vulkan-runtime-test.txt"
          if ($testExitCode -ne 0) {
            throw "Backend validation failed with exit code $testExitCode"
          }

          $llamaDll = Join-Path $env:GITHUB_WORKSPACE "testenv\Lib\site-packages\llama_cpp\lib\llama.dll"
          dumpbin /DEPENDENTS $llamaDll |
            Tee-Object "reports\legacy-vulkan-dll-dependencies.txt"

      - name: Create reproducibility manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $manifest = "reports\legacy-vulkan-build-manifest.txt"
          "package_version=$env:PACKAGE_VERSION" | Set-Content $manifest
          "source_version=$env:SOURCE_VERSION" | Add-Content $manifest
          "source_commit=$(git -C src rev-parse HEAD)" | Add-Content $manifest
          "python=$(python --version 2>&1)" | Add-Content $manifest
          "cmake_args=$env:CMAKE_ARGS" | Add-Content $manifest
          "core_srwlock_fix=enabled" | Add-Content $manifest
          "vulkan_registry_pod_state=enabled" | Add-Content $manifest
          "vulkan_registry_srwlock=enabled" | Add-Content $manifest
          "vulkan_direct_registry_device_init=enabled" | Add-Content $manifest
          "vulkan_preconstruction_registry_lookup=removed" | Add-Content $manifest
          "vulkan_buffer_type_direct_binding=enabled" | Add-Content $manifest
          "vulkan_buffer_type_checkpoints=enabled" | Add-Content $manifest
          "vulkan_pinned_host_buffer=disabled" | Add-Content $manifest
          "vulkan_minimal_intel_feature_profile=enabled" | Add-Content $manifest
          "vulkan_optional_extensions=disabled" | Add-Content $manifest
          "vulkan_async_backend=disabled" | Add-Content $manifest
          "vulkan_device_init_checkpoints=enabled" | Add-Content $manifest
          "vulkan_cpu_host_buffer_fallback=enabled" | Add-Content $manifest
          "vulkan_registry_return_checkpoints=enabled" | Add-Content $manifest
          "vulkan_per_device_critical_section=enabled" | Add-Content $manifest
          "vulkan_recursive_lock_sites_replaced=6" | Add-Content $manifest
          "vulkan_queue_creation_checkpoints=enabled" | Add-Content $manifest
          "vulkan_compile_critical_section=enabled" | Add-Content $manifest
          "vulkan_compile_lock_sites_replaced=8" | Add-Content $manifest
          "vulkan_shader_loader_checkpoints=enabled" | Add-Content $manifest
          "vulkan_runtime_fp16_rte_spirv_rewrite=disabled" | Add-Content $manifest
          "vulkan_multi_add=disabled" | Add-Content $manifest
          "vulkan_pipeline_stage_checkpoints=enabled" | Add-Content $manifest
          "submodules:" | Add-Content $manifest
          git -C src submodule status | Add-Content $manifest

          Get-ChildItem "wheelhouse\*.whl" -ErrorAction SilentlyContinue | ForEach-Object {
            "wheel=$($_.Name)" | Add-Content $manifest
            "wheel_size=$($_.Length)" | Add-Content $manifest
            "wheel_sha256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" | Add-Content $manifest
          }
          Get-Content $manifest

      - name: Upload wheel and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-python-${{ env.PACKAGE_VERSION }}-win-amd64
          path: |
            wheelhouse/*.whl
            reports/*.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish legacy Vulkan prerelease
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download legacy Vulkan wheel and reports
        uses: actions/download-artifact@v7
        with:
          name: llama-cpp-python-${{ env.PACKAGE_VERSION }}-win-amd64
          path: release-assets

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Experimental Windows x64 / Python 3.9 Vulkan compatibility wheel for llama-cpp-python 0.3.34 and legacy Intel Iris Xe driver stacks.

          This build keeps the confirmed GGML and Vulkan-registry SRWLOCK fixes, direct registry-device binding, CPU host-buffer fallback, minimal Intel Xe feature profile, queue-lock compatibility fix, and shader compile critical-section fix. It disables the optional runtime FP16 round-to-even SPIR-V rewrite and multi_add path for the legacy Intel driver. Detailed checkpoints identify the requested pipeline and separate shader-module creation, pipeline-layout creation, compute-pipeline creation, and completion locking during the real Iris Xe test.

          The GitHub Windows runner validated:
          - wheel packaging and clean Python 3.9 installation
          - llama_backend_init() and llama_backend_free()
          - DLL dependencies
          - reproducibility manifest and SHA-256

          GitHub's runner has no Vulkan GPU. It can validate compilation, packaging, and backend initialization, but actual tensor placement and offload must be validated on the target Iris Xe workstation. This is a diagnostic compatibility prerelease, not a replacement for the stable optimized CPU wheel.
          EOF

      - name: Create or update public prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.3.34-win39-vulkan-xelegacy-r8
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GH_REPO"
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GH_REPO" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          fi
