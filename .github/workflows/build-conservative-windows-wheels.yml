name: Build conservative Windows wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: llama-cpp-python release version
        required: true
        default: "0.3.34"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-conservative-windows-wheels.yml"

permissions:
  contents: read

env:
  SOURCE_VERSION: ${{ inputs.version || '0.3.34' }}
  VULKAN_SDK_VERSION: "1.4.341.0"

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu-conservative
            vulkan: "false"
          - variant: vulkan-conservative
            vulkan: "true"

    env:
      BUILD_VARIANT: ${{ matrix.variant }}
      ENABLE_VULKAN: ${{ matrix.vulkan }}

    steps:
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python 3.9 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64
          cache: pip

      - name: Install Vulkan SDK
        if: matrix.vulkan == 'true'
        shell: pwsh
        run: |
          choco install vulkan-sdk --version="$env:VULKAN_SDK_VERSION" --no-progress -y
          $sdk = Join-Path "C:\VulkanSDK" $env:VULKAN_SDK_VERSION
          if (-not (Test-Path $sdk)) {
            throw "Vulkan SDK was not found at $sdk"
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          & "$sdk\Bin\glslc.exe" --version

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install build wheel ninja

      - name: Clone exact upstream release
        shell: pwsh
        run: |
          $tag = "v$env:SOURCE_VERSION"
          git clone --branch $tag --depth 1 --recurse-submodules --shallow-submodules https://github.com/abetlen/llama-cpp-python.git src
          Set-Location src
          git rev-parse HEAD
          git submodule status

      - name: Configure conservative MSVC build
        shell: pwsh
        run: |
          $flags = @(
            "-DGGML_NATIVE=OFF",
            "-DGGML_OPENMP=OFF",
            "-DGGML_BACKEND_DL=OFF",
            "-DGGML_CPU_ALL_VARIANTS=OFF",
            "-DGGML_BLAS=OFF",
            "-DGGML_CUDA=OFF",
            "-DGGML_HIP=OFF",
            "-DGGML_SYCL=OFF",
            "-DGGML_OPENCL=OFF",
            "-DGGML_RPC=OFF",
            "-DGGML_METAL=OFF",
            "-DGGML_AVX=ON",
            "-DGGML_AVX2=ON",
            "-DGGML_FMA=ON",
            "-DGGML_F16C=ON",
            "-DGGML_AVX512=OFF",
            "-DGGML_AVX512_VBMI=OFF",
            "-DGGML_AVX512_VNNI=OFF",
            "-DGGML_AVX512_BF16=OFF",
            "-DGGML_AMX_TILE=OFF",
            "-DGGML_AMX_INT8=OFF",
            "-DGGML_AMX_BF16=OFF",
            "-DLLAMA_BUILD_TESTS=OFF",
            "-DLLAMA_BUILD_EXAMPLES=OFF",
            "-DLLAMA_BUILD_TOOLS=OFF",
            "-DLLAMA_BUILD_SERVER=OFF"
          )

          if ($env:ENABLE_VULKAN -eq "true") {
            $flags += "-DGGML_VULKAN=ON"
          } else {
            $flags += "-DGGML_VULKAN=OFF"
          }

          $argsLine = $flags -join " "
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_ARGS=$argsLine" >> $env:GITHUB_ENV
          Write-Host "CMAKE_ARGS=$argsLine"

      - name: Build wheel
        shell: pwsh
        run: |
          Set-Location src
          $outDir = Join-Path $env:GITHUB_WORKSPACE "wheelhouse\$env:BUILD_VARIANT"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          python -m build --wheel --outdir $outDir

      - name: Verify wheel in clean Python 3.9 environment
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "wheelhouse\$env:BUILD_VARIANT\*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel was produced"
          }

          python -m venv "testenv-$env:BUILD_VARIANT"
          $testPython = Join-Path $env:GITHUB_WORKSPACE "testenv-$env:BUILD_VARIANT\Scripts\python.exe"
          & $testPython -m pip install --upgrade "pip<26"
          & $testPython -m pip install --no-cache-dir $wheel.FullName

          New-Item -ItemType Directory -Force "reports\$env:BUILD_VARIANT" | Out-Null

          @'
          import os
          import platform
          import sys
          from pathlib import Path

          import llama_cpp

          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("llama-cpp-python:", llama_cpp.__version__)
          print("Package:", llama_cpp.__file__)

          lib_dir = Path(llama_cpp.__file__).resolve().parent / "lib"
          os.add_dll_directory(str(lib_dir))
          print("Native libraries:")
          for path in sorted(lib_dir.glob("*.dll")):
              print(" ", path.name, path.stat().st_size)

          print("Calling llama_backend_init()", flush=True)
          llama_cpp.llama_backend_init()
          print("BACKEND INIT OK", flush=True)
          llama_cpp.llama_backend_free()
          print("BACKEND FREE OK", flush=True)
          '@ | & $testPython -I -X faulthandler -u 2>&1 | Tee-Object "reports\$env:BUILD_VARIANT\backend-init.txt"

      - name: Create reproducibility manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "reports\$env:BUILD_VARIANT" | Out-Null

          $manifest = "reports\$env:BUILD_VARIANT\build-manifest.txt"
          "variant=$env:BUILD_VARIANT" | Set-Content $manifest
          "source_version=$env:SOURCE_VERSION" | Add-Content $manifest
          "source_commit=$(git -C src rev-parse HEAD)" | Add-Content $manifest
          "python=$(python --version 2>&1)" | Add-Content $manifest
          "cmake_args=$env:CMAKE_ARGS" | Add-Content $manifest
          "submodules:" | Add-Content $manifest
          git -C src submodule status | Add-Content $manifest

          Get-ChildItem "wheelhouse\$env:BUILD_VARIANT\*.whl" -ErrorAction SilentlyContinue | ForEach-Object {
            "wheel=$($_.Name)" | Add-Content $manifest
            "wheel_size=$($_.Length)" | Add-Content $manifest
            "wheel_sha256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" | Add-Content $manifest
          }

          Get-Content $manifest

      - name: Upload wheel and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-python-${{ env.SOURCE_VERSION }}-${{ matrix.variant }}-win-amd64
          path: |
            wheelhouse/${{ matrix.variant }}/*.whl
            reports/${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 30
