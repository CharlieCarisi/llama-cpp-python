name: Build llama backend-init diagnostics

on:
  workflow_call:
    inputs:
      version:
        description: llama-cpp-python release version
        required: false
        type: string
        default: "0.3.34"
      publish_release:
        description: Publish successful wheels in a GitHub prerelease
        required: false
        type: boolean
        default: false
      release_tag:
        description: GitHub release tag
        required: false
        type: string
        default: "v0.3.34-win39-ggml-init-diagnostic-r3"
  workflow_dispatch:
    inputs:
      version:
        description: llama-cpp-python release version
        required: true
        default: "0.3.34"
      publish_release:
        description: Publish successful wheels in a GitHub prerelease
        required: true
        type: boolean
        default: true
      release_tag:
        description: GitHub release tag
        required: true
        default: "v0.3.34-win39-ggml-init-diagnostic-r3"

permissions:
  contents: write

env:
  SOURCE_VERSION: ${{ inputs.version || '0.3.34' }}

jobs:
  build:
    name: init-stage-${{ matrix.stage }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: "4"
            variant: ggml-init-internal
            package_suffix: diag.ggml1

    env:
      DIAG_STAGE: ${{ matrix.stage }}
      BUILD_VARIANT: ${{ matrix.variant }}
      PACKAGE_VERSION: ${{ format('{0}+{1}', inputs.version || '0.3.34', matrix.package_suffix) }}

    steps:
      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python 3.9 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install build wheel ninja

      - name: Clone exact upstream release
        shell: pwsh
        run: |
          $tag = "v$env:SOURCE_VERSION"
          git clone --branch $tag --depth 1 --recurse-submodules --shallow-submodules https://github.com/abetlen/llama-cpp-python.git src
          git -C src rev-parse HEAD
          git -C src submodule status

      - name: Patch monolithic layout and staged initialization
        shell: pwsh
        run: |
          $pythonCmakePath = "src\CMakeLists.txt"
          $pythonCmake = Get-Content $pythonCmakePath -Raw
          $sharedSetting = 'set(BUILD_SHARED_LIBS "On")'
          if (-not $pythonCmake.Contains($sharedSetting)) {
            throw "Expected BUILD_SHARED_LIBS setting was not found"
          }
          $pythonCmake = $pythonCmake.Replace(
            $sharedSetting,
            'set(BUILD_SHARED_LIBS "Off")'
          )

          $ggmlRuntimeInstalls = [regex]'(?ms)\s*install\(\s*FILES \$<TARGET_RUNTIME_DLLS:ggml>\s*DESTINATION [^\r\n]+\s*\)'
          $ggmlRuntimeInstallMatches = $ggmlRuntimeInstalls.Matches($pythonCmake)
          if ($ggmlRuntimeInstallMatches.Count -ne 2) {
            throw "Expected two ggml runtime-DLL install rules, found $($ggmlRuntimeInstallMatches.Count)"
          }
          $pythonCmake = $ggmlRuntimeInstalls.Replace($pythonCmake, "")
          Set-Content $pythonCmakePath $pythonCmake -Encoding UTF8

          $llamaCmakePath = "src\vendor\llama.cpp\src\CMakeLists.txt"
          $llamaCmake = Get-Content $llamaCmakePath -Raw
          $addLlama = [regex]'add_library\(llama\s*\r?\n'
          if (-not $addLlama.IsMatch($llamaCmake)) {
            throw "Expected add_library(llama) declaration was not found"
          }
          $llamaCmake = $addLlama.Replace(
            $llamaCmake,
            "add_library(llama SHARED`r`n",
            1
          )
          Set-Content $llamaCmakePath $llamaCmake -Encoding UTF8

          $llamaSourcePath = "src\vendor\llama.cpp\src\llama.cpp"
          $llamaSource = Get-Content $llamaSourcePath -Raw
          $oldInit = @'
          void llama_backend_init(void) {
              ggml_time_init();

              // needed to initialize f16 tables
              {
                  struct ggml_init_params params = { 0, NULL, false };
                  struct ggml_context * ctx = ggml_init(params);
                  ggml_free(ctx);
              }

              if (!ggml_backend_reg_count()) {
                  ggml_backend_load_all();
              }
          }
          '@

          $stage1 = @'
          void llama_backend_init(void) {
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init begin\n");
              fflush(stderr);
              ggml_time_init();
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init ok\n");
              fflush(stderr);
          }
          '@

          $stage2 = @'
          void llama_backend_init(void) {
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init begin\n");
              fflush(stderr);
              ggml_time_init();
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init ok\n");
              fflush(stderr);

              fprintf(stderr, "[init-diag] stage 2: ggml_init begin\n");
              fflush(stderr);
              struct ggml_init_params params = { 0, NULL, false };
              struct ggml_context * ctx = ggml_init(params);
              fprintf(stderr, "[init-diag] stage 2: ggml_init ok\n");
              fflush(stderr);
              ggml_free(ctx);
              fprintf(stderr, "[init-diag] stage 2: ggml_free ok\n");
              fflush(stderr);
          }
          '@

          $stage3 = @'
          void llama_backend_init(void) {
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init begin\n");
              fflush(stderr);
              ggml_time_init();
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init ok\n");
              fflush(stderr);

              fprintf(stderr, "[init-diag] stage 2: ggml_init begin\n");
              fflush(stderr);
              struct ggml_init_params params = { 0, NULL, false };
              struct ggml_context * ctx = ggml_init(params);
              fprintf(stderr, "[init-diag] stage 2: ggml_init ok\n");
              fflush(stderr);
              ggml_free(ctx);
              fprintf(stderr, "[init-diag] stage 2: ggml_free ok\n");
              fflush(stderr);

              fprintf(stderr, "[init-diag] stage 3: backend registry count begin\n");
              fflush(stderr);
              const size_t reg_count = ggml_backend_reg_count();
              fprintf(stderr, "[init-diag] stage 3: registry count = %zu\n", reg_count);
              fflush(stderr);
              if (!reg_count) {
                  fprintf(stderr, "[init-diag] stage 3: backend load begin\n");
                  fflush(stderr);
                  ggml_backend_load_all();
                  fprintf(stderr, "[init-diag] stage 3: backend load ok\n");
                  fflush(stderr);
              }
              fprintf(stderr, "[init-diag] stage 3: backends ok\n");
              fflush(stderr);
          }
          '@

          $stage4 = @'
          void llama_backend_init(void) {
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init begin\n");
              fflush(stderr);
              ggml_time_init();
              fprintf(stderr, "[init-diag] stage 1: ggml_time_init ok\n");
              fflush(stderr);

              fprintf(stderr, "[init-diag] stage 2: ggml_init begin\n");
              fflush(stderr);
              struct ggml_init_params params = { 0, NULL, false };
              struct ggml_context * ctx = ggml_init(params);
              fprintf(stderr, "[init-diag] stage 2: ggml_init ok\n");
              fflush(stderr);
              ggml_free(ctx);
              fprintf(stderr, "[init-diag] stage 2: ggml_free ok\n");
              fflush(stderr);
          }
          '@

          if (-not $llamaSource.Contains($oldInit)) {
            throw "Expected llama_backend_init implementation was not found"
          }

          switch ($env:DIAG_STAGE) {
            "1" { $newInit = $stage1 }
            "2" { $newInit = $stage2 }
            "3" { $newInit = $stage3 }
            "4" { $newInit = $stage4 }
            default { throw "Unsupported diagnostic stage: $env:DIAG_STAGE" }
          }
          $llamaSource = $llamaSource.Replace($oldInit, $newInit)
          Set-Content $llamaSourcePath $llamaSource -Encoding UTF8

          $ggmlSourcePath = "src\vendor\llama.cpp\ggml\src\ggml.c"
          $ggmlSource = Get-Content $ggmlSourcePath -Raw
          $oldGgmlInit = @'
          struct ggml_context * ggml_init(struct ggml_init_params params) {
              static bool is_first_call = true;

              ggml_critical_section_start();

              if (is_first_call) {
                  // initialize time system (required on Windows)
                  ggml_time_init();

                  is_first_call = false;
              }

              ggml_critical_section_end();

              struct ggml_context * ctx = GGML_MALLOC(sizeof(struct ggml_context));

              // allow to call ggml_init with 0 size
              if (params.mem_size == 0) {
                  params.mem_size = GGML_MEM_ALIGN;
              }

              const size_t mem_size = params.mem_buffer ? params.mem_size : GGML_PAD(params.mem_size, GGML_MEM_ALIGN);

              *ctx = (struct ggml_context) {
                  /*.mem_size           =*/ mem_size,
                  /*.mem_buffer         =*/ params.mem_buffer ? params.mem_buffer : ggml_aligned_malloc(mem_size),
                  /*.mem_buffer_owned   =*/ params.mem_buffer ? false : true,
                  /*.no_alloc           =*/ params.no_alloc,
                  /*.n_objects          =*/ 0,
                  /*.objects_begin      =*/ NULL,
                  /*.objects_end        =*/ NULL,
              };

              GGML_ASSERT(ctx->mem_buffer != NULL);

              GGML_ASSERT_ALIGNED(ctx->mem_buffer);

              GGML_PRINT_DEBUG("%s: context initialized\n", __func__);

              return ctx;
          }
          '@

          $diagnosticGgmlInit = @'
          struct ggml_context * ggml_init(struct ggml_init_params params) {
              static bool is_first_call = true;

              fprintf(stderr, "[ggml-init] 2.1 critical section begin\n");
              fflush(stderr);
              ggml_critical_section_start();
              fprintf(stderr, "[ggml-init] 2.1 critical section locked\n");
              fflush(stderr);

              if (is_first_call) {
                  fprintf(stderr, "[ggml-init] 2.2 first-call timer begin\n");
                  fflush(stderr);
                  ggml_time_init();
                  fprintf(stderr, "[ggml-init] 2.2 first-call timer ok\n");
                  fflush(stderr);
                  is_first_call = false;
              }

              fprintf(stderr, "[ggml-init] 2.3 critical section unlock begin\n");
              fflush(stderr);
              ggml_critical_section_end();
              fprintf(stderr, "[ggml-init] 2.3 critical section unlocked\n");
              fflush(stderr);

              fprintf(stderr, "[ggml-init] 2.4 context malloc begin (%zu bytes)\n", sizeof(struct ggml_context));
              fflush(stderr);
              struct ggml_context * ctx = GGML_MALLOC(sizeof(struct ggml_context));
              fprintf(stderr, "[ggml-init] 2.4 context malloc result=%p\n", (void *) ctx);
              fflush(stderr);

              if (params.mem_size == 0) {
                  params.mem_size = GGML_MEM_ALIGN;
              }
              fprintf(stderr, "[ggml-init] 2.5 normalized mem_size=%zu\n", params.mem_size);
              fflush(stderr);

              const size_t mem_size = params.mem_buffer ? params.mem_size : GGML_PAD(params.mem_size, GGML_MEM_ALIGN);
              fprintf(stderr, "[ggml-init] 2.6 aligned allocation begin (%zu bytes)\n", mem_size);
              fflush(stderr);
              void * mem_buffer = params.mem_buffer ? params.mem_buffer : ggml_aligned_malloc(mem_size);
              fprintf(stderr, "[ggml-init] 2.6 aligned allocation result=%p\n", mem_buffer);
              fflush(stderr);

              fprintf(stderr, "[ggml-init] 2.7 context assignment begin\n");
              fflush(stderr);
              *ctx = (struct ggml_context) {
                  /*.mem_size           =*/ mem_size,
                  /*.mem_buffer         =*/ mem_buffer,
                  /*.mem_buffer_owned   =*/ params.mem_buffer ? false : true,
                  /*.no_alloc           =*/ params.no_alloc,
                  /*.n_objects          =*/ 0,
                  /*.objects_begin      =*/ NULL,
                  /*.objects_end        =*/ NULL,
              };
              fprintf(stderr, "[ggml-init] 2.7 context assignment ok\n");
              fflush(stderr);

              GGML_ASSERT(ctx->mem_buffer != NULL);
              fprintf(stderr, "[ggml-init] 2.8 non-null assertion ok\n");
              fflush(stderr);

              GGML_ASSERT_ALIGNED(ctx->mem_buffer);
              fprintf(stderr, "[ggml-init] 2.9 alignment assertion ok\n");
              fflush(stderr);

              GGML_PRINT_DEBUG("%s: context initialized\n", __func__);
              fprintf(stderr, "[ggml-init] 2.10 return context=%p\n", (void *) ctx);
              fflush(stderr);

              return ctx;
          }
          '@

          if (-not $ggmlSource.Contains($oldGgmlInit)) {
            throw "Expected ggml_init implementation was not found"
          }
          $ggmlSource = $ggmlSource.Replace($oldGgmlInit, $diagnosticGgmlInit)
          Set-Content $ggmlSourcePath $ggmlSource -Encoding UTF8

          $initPath = "src\llama_cpp\__init__.py"
          $init = Get-Content $initPath -Raw
          $oldVersion = "__version__ = `"$env:SOURCE_VERSION`""
          $newVersion = "__version__ = `"$env:PACKAGE_VERSION`""
          if (-not $init.Contains($oldVersion)) {
            throw "Expected package version $oldVersion was not found"
          }
          $init = $init.Replace($oldVersion, $newVersion)
          Set-Content $initPath $init -Encoding UTF8

          git -C src diff -- CMakeLists.txt llama_cpp/__init__.py vendor/llama.cpp/src/CMakeLists.txt vendor/llama.cpp/src/llama.cpp vendor/llama.cpp/ggml/src/ggml.c

      - name: Configure conservative monolithic CPU build
        shell: pwsh
        run: |
          $flags = @(
            "-DBUILD_SHARED_LIBS=OFF",
            "-DLLAVA_BUILD=OFF",
            "-DGGML_NATIVE=OFF",
            "-DGGML_OPENMP=OFF",
            "-DGGML_BACKEND_DL=OFF",
            "-DGGML_CPU_ALL_VARIANTS=OFF",
            "-DGGML_CPU_REPACK=OFF",
            "-DGGML_BLAS=OFF",
            "-DGGML_CUDA=OFF",
            "-DGGML_HIP=OFF",
            "-DGGML_SYCL=OFF",
            "-DGGML_OPENCL=OFF",
            "-DGGML_RPC=OFF",
            "-DGGML_METAL=OFF",
            "-DGGML_VULKAN=OFF",
            "-DGGML_SSE42=ON",
            "-DGGML_AVX=ON",
            "-DGGML_AVX2=ON",
            "-DGGML_BMI2=ON",
            "-DGGML_AVX512=OFF",
            "-DGGML_AVX512_VBMI=OFF",
            "-DGGML_AVX512_VNNI=OFF",
            "-DGGML_AVX512_BF16=OFF",
            "-DLLAMA_BUILD_TESTS=OFF",
            "-DLLAMA_BUILD_EXAMPLES=OFF",
            "-DLLAMA_BUILD_TOOLS=OFF",
            "-DLLAMA_BUILD_SERVER=OFF"
          )

          $argsLine = $flags -join " "
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_ARGS=$argsLine" >> $env:GITHUB_ENV
          Write-Host "CMAKE_ARGS=$argsLine"

      - name: Build wheel
        shell: pwsh
        run: |
          Set-Location src
          $outDir = Join-Path $env:GITHUB_WORKSPACE "wheelhouse\$env:BUILD_VARIANT"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          python -m build --wheel --outdir $outDir

      - name: Verify diagnostic wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem "wheelhouse\$env:BUILD_VARIANT\*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel was produced"
          }

          python -m venv "testenv-$env:BUILD_VARIANT"
          $testPython = Join-Path $env:GITHUB_WORKSPACE "testenv-$env:BUILD_VARIANT\Scripts\python.exe"
          & $testPython -m pip install --upgrade "pip<26"
          & $testPython -m pip install --no-cache-dir $wheel.FullName

          New-Item -ItemType Directory -Force reports | Out-Null
          & $testPython -I -X faulthandler -u -c "import llama_cpp; print(llama_cpp.__version__); llama_cpp.llama_backend_init(); print('BACKEND OK')" 2>&1 |
            Tee-Object "reports\$env:BUILD_VARIANT-backend-init.txt"

      - name: Create reproducibility manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $manifest = "reports\$env:BUILD_VARIANT-build-manifest.txt"
          "variant=$env:BUILD_VARIANT" | Set-Content $manifest
          "diagnostic_stage=$env:DIAG_STAGE" | Add-Content $manifest
          "package_version=$env:PACKAGE_VERSION" | Add-Content $manifest
          "source_version=$env:SOURCE_VERSION" | Add-Content $manifest
          "source_commit=$(git -C src rev-parse HEAD)" | Add-Content $manifest
          "python=$(python --version 2>&1)" | Add-Content $manifest
          "cmake_args=$env:CMAKE_ARGS" | Add-Content $manifest
          git -C src submodule status | Add-Content $manifest

          Get-ChildItem "wheelhouse\$env:BUILD_VARIANT\*.whl" -ErrorAction SilentlyContinue | ForEach-Object {
            "wheel=$($_.Name)" | Add-Content $manifest
            "wheel_size=$($_.Length)" | Add-Content $manifest
            "wheel_sha256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" | Add-Content $manifest
          }
          Get-Content $manifest

      - name: Upload wheel and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-python-${{ env.PACKAGE_VERSION }}-win-amd64
          path: |
            wheelhouse/${{ matrix.variant }}/*.whl
            reports/${{ matrix.variant }}-*.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish diagnostic release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels and reports
        uses: actions/download-artifact@v7
        with:
          pattern: llama-cpp-python-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Diagnostic Windows x64 / Python 3.9 wheels for llama-cpp-python 0.3.34.

          The `diag.ggml1` wheel instruments every operation inside `ggml_init()`:
          the global critical-section mutex, first-call timer, normal and aligned
          allocations, context assignment, and alignment checks.

          This wheel is diagnostic only. The last stderr checkpoint printed before
          an access violation identifies the exact failing operation.
          EOF

      - name: Create or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          fi
